name: Build ENGKR KSU v3.1.0 + SUSFS (The Forceful Injector V9)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Fix Git Ownership & Install Basics
        run: |
          apt-get update
          apt-get install -y git wget python3 unifdef
          git config --global --add safe.directory '*'

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 sudo tar
          ln -s /usr/bin/python2 /usr/bin/python || true

      - name: 1. Laser Purge
        run: |
          echo "[*] Scrubbing old traces..."
          sed -i '/kernelsu/d' drivers/Makefile drivers/Kconfig fs/Makefile fs/Kconfig || true

      - name: 2. Forceful VFS Hooking (The Hammer Approach)
        run: |
          echo "[*] Injecting Hooks with Forceful Sed..."
          
          # حقن Hook في open.c
          sed -i '/long do_sys_open/a \\textern bool ksu_vfs_open_hook; extern int ksu_handle_open(int *dfd, const char __user **filename_ptr, int *flags, umode_t *mode); if (unlikely(ksu_vfs_open_hook)) ksu_handle_open(&dfd, &filename, &flags, &mode);' fs/open.c
          
          # حقن Hook في exec.c
          sed -i '/static int do_execveat_common/a \\textern bool ksu_execveat_hook; extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *ptr, int *flags); if (unlikely(ksu_execveat_hook)) ksu_handle_execveat(&fd, &filename, &bprm, &flags);' fs/exec.c

      - name: 3. Fetching KSU & SUSFS
        run: |
          git clone -b v3.1.0 https://github.com/tiann/KernelSU.git /tmp/ksu_official
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          patch -p1 < $(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.9.patch" | head -n 1) || true
          
          cp -r /tmp/ksu_official/kernel fs/kernelsu
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> fs/Makefile
          echo 'source "fs/kernelsu/Kconfig"' >> fs/Kconfig
          
          # الحقن اليدوي لـ SUSFS
          sed -i '1s/^/#include <linux\/susfs.h>\n/' fs/kernelsu/ksu.c
          echo -e "\nstatic int __init engkr_ksu_susfs_init(void) { susfs_sus_path(); return 0; }\nlate_initcall(engkr_ksu_susfs_init);" >> fs/kernelsu/ksu.c
          echo "ccflags-y += -DCONFIG_KSU_SUSFS -DKSU_VERSION=32302" >> fs/kernelsu/Kbuild

      - name: 4. Final Verification Gate
        run: |
          echo "--- Checking fs/open.c for Hook ---"
          grep -C 5 "ksu_handle_open" fs/open.c
          
          if ! grep -q "ksu_handle_open" fs/open.c; then 
              echo "[-] FATAL: Hook failed!"
              exit 1
          fi
          echo "[+] System Hooks Verified!"

      - name: 5. Execute Production Build
        run: |
          chmod -R +x scripts/ || true
          ./kernel_build_fixed.sh

      - name: 6. Upload
        uses: actions/upload-artifact@v4
        with:
          name: ENGKR-YSL-KSU-32302-SUSFS-FORCED
          path: |
            build/Image.gz-dtb
            *.zip
