name: ENGKR Source Recon V13 (The SUSFS v1.5.5 Hunt)

on:
  workflow_dispatch:

jobs:
  kernel-autopsy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: ENGKR SUSFS Version Tracker
        run: |
          echo -e "\n============================================================"
          echo "ENGKR KERNEL SOURCE AUTOPSY REPORT - STAGE 13"
          echo "============================================================"

          echo -e "\n[1] INTERROGATING KSU-NEXT (What version does it want?)"
          echo "--------------------------------------------------"
          # البحث عن إصدار SUSFS المطلوب داخل ملفات KSU-Next
          grep -rn -i "SUSFS_VERSION" drivers/kernelsu/ || echo "[-] No hardcoded SUSFS version found in KSU-Next."
          
          echo -e "\n[2] FETCHING SUSFS v1.5.5 BRANCH"
          echo "--------------------------------------------------"
          rm -rf /tmp/susfs4ksu
          # استنساخ فرع v1.5.5 تحديداً بدلاً من الفرع الرئيسي
          git clone --depth=1 -b susfs_v1.5.5 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu 2>/dev/null || git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu 2>/dev/null
          
          cd /tmp/susfs4ksu
          echo "[+] Current SUSFS branch/commit:"
          git log -1 --format="%h - %s"
          
          echo -e "\n[3] INSPECTING KERNEL 4.9 PATCH IN v1.5.5"
          echo "--------------------------------------------------"
          PATCH_49=$(find kernel_patches -name "*kernel-4.9.patch" | head -n 1)
          if [ -n "$PATCH_49" ]; then
              echo "[+] Found 4.9 patch: $PATCH_49"
              # فحص ما إذا كان الباتش يحتوي على دوال v1.5.5 الحديثة
              grep -i "susfs_enable_log" kernel_patches/fs/susfs.c || echo "[-] WARNING: susfs_enable_log MISSING in fs/susfs.c!"
              grep -i "void \*" kernel_patches/include/linux/susfs.h | head -n 3 || echo "[-] WARNING: Pointer ABI (void *) not found in susfs.h!"
          else
              echo "[-] CRITICAL: No 4.9 patch found in this SUSFS version!"
          fi

          echo -e "\n[4] INSPECTING KERNEL 4.14 PATCH (Fallback Option)"
          echo "--------------------------------------------------"
          # إذا كان 4.9 قديماً، سنفحص 4.14 لنرى إذا كان يحتوي على الدوال الحديثة
          grep -i "susfs_enable_log" kernel_patches/fs/susfs.c > /dev/null && echo "[+] 4.14 fs/susfs.c has the new v1.5.5 functions!" || echo "[-] 4.14 fs/susfs.c also missing new functions!"

          echo -e "\n============================================================"
          echo "STAGE 13 COMPLETE"
          echo "============================================================"
