name: ENGKR Source Recon V12 (Final Full Rehearsal)

on:
  workflow_dispatch:

jobs:
  kernel-rehearsal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: The Ultimate Python Hack (Carpet Bombing KSU Constants)
        run: |
          # 1. إزالة واجهة menuconfig
          sed -i '/menuconfig/d' kernel_build_fixed.sh || true
          # 2. تخطي حاجز الإصدار للمترجم
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer.//g' include/linux/compiler-gcc.h || true
          
          # 3. سكربت الثوابت الخاص بـ KSU
          cat << 'EOF' > patch_ksu.py
          import os, re
          pattern = r'(?:static\s+)?const\s+[a-zA-Z0-9_ ]+\s+(KSU_[A-Z0-9_]+)\s*=\s*([^;]+);'
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if not file.endswith(('.c', '.h')): continue
                  path = os.path.join(root, file)
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      new_content = re.sub(pattern, r'#define \1 \2', content)
                      if new_content != content:
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(new_content)
                  except Exception:
                      pass
          EOF
          python3 patch_ksu.py

      - name: The ENGKR Precision Purge (Clearing Broken SUSFS Hooks)
        run: |
          cat << 'EOF' > purge_script.py
          import os
          target_dirs = ['fs', 'include', 'kernel', 'mm', 'block', 'security']
          infected_files = []
          for d in target_dirs:
              for root, dirs, files in os.walk(d):
                  for file in files:
                      if file.endswith(('.c', '.h')):
                          path = os.path.join(root, file)
                          try:
                              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                                  if 'CONFIG_KSU_SUSFS' in f.read():
                                      infected_files.append(path)
                          except: pass
          
          for path in infected_files:
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()
              out_lines = []
              skip_depth = 0
              for line in lines:
                  clean_line = line.strip()
                  if skip_depth > 0:
                      if clean_line.startswith('#endif'): skip_depth -= 1
                      elif clean_line.startswith('#if'): skip_depth += 1
                      continue
                  if clean_line.startswith('#ifdef CONFIG_KSU_SUSFS') or clean_line.startswith('#if defined(CONFIG_KSU_SUSFS') or clean_line.startswith('#ifndef CONFIG_KSU_SUSFS'):
                      skip_depth = 1
                      continue
                  out_lines.append(line)
              with open(path, 'w', encoding='utf-8') as f:
                  f.writelines(out_lines)
          EOF
          python3 purge_script.py

      - name: Integrate Official SUSFS 4.9
        run: |
          rm -fv fs/susfs.c include/linux/susfs.h
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu 2>/dev/null
          cp -v /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          PATCH_FILE=$(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.9.patch" | head -n 1)
          patch -p1 < "$PATCH_FILE" > /tmp/patch_run.txt 2>&1 || true

      - name: Activate KSU & SUSFS in Defconfig
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> arch/arm64/configs/ysl-perf_defconfig

      - name: The ENGKR Hardware Backdoor (WCNSS Direct Memory Override)
        run: |
          cat << 'EOF' > patch_mac_backdoor.py
          import os, re
          target = 'drivers/soc/qcom/wcnss/wcnss_wlan.c'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8') as f: content = f.read()
              backdoor_func = """
              static ssize_t engkr_mac_store(struct device *dev, struct device_attribute *attr, const char *buf, size_t count) {
                  unsigned int mac[6];
                  if (!penv) return count;
                  if (sscanf(buf, "%x:%x:%x:%x:%x:%x", &mac[0], &mac[1], &mac[2], &mac[3], &mac[4], &mac[5]) == 6) {
                      penv->wlan_nv_mac_addr[0] = (char)mac[0]; penv->wlan_nv_mac_addr[1] = (char)mac[1];
                      penv->wlan_nv_mac_addr[2] = (char)mac[2]; penv->wlan_nv_mac_addr[3] = (char)mac[3];
                      penv->wlan_nv_mac_addr[4] = (char)mac[4]; penv->wlan_nv_mac_addr[5] = (char)mac[5];
                  }
                  return count;
              }
              """
              attr_match = re.search(r'DEVICE_ATTR(?:_RO)?\s*\(\s*wcnss_mac_addr\s*,\s*[^,]+\s*,\s*([a-zA-Z0-9_]+)', content)
              if attr_match:
                  show_func = attr_match.group(1)
                  func_match = re.search(rf'static\s+ssize_t\s+{show_func}', content)
                  if func_match:
                      content = content[:func_match.start()] + backdoor_func + "\n" + content[func_match.start():]
                  else:
                      content = content.replace(attr_match.group(0), backdoor_func + "\n" + attr_match.group(0))
                  content = re.sub(r'(static\s+)?DEVICE_ATTR(?:_RO)?\s*\(\s*wcnss_mac_addr[^;]+;', f'static DEVICE_ATTR(wcnss_mac_addr, 0664, {show_func}, engkr_mac_store);', content)
                  with open(target, 'w', encoding='utf-8') as f: f.write(content)
          EOF
          python3 patch_mac_backdoor.py

      - name: THE FINAL AUDIT (Proving everything is ready)
        run: |
          echo -e "\n============================================================"
          echo "ENGKR FINAL REHEARSAL AUDIT (PRE-BUILD CHECK)"
          echo "============================================================"

          echo -e "\n[1] MAC BACKDOOR CHECK:"
          echo "--------------------------------------------------"
          grep -C 2 "engkr_mac_store" drivers/soc/qcom/wcnss/wcnss_wlan.c || echo "[-] MAC Backdoor failed to inject!"

          echo -e "\n[2] DEFCONFIG CHECK:"
          echo "--------------------------------------------------"
          tail -n 6 arch/arm64/configs/ysl-perf_defconfig

          echo -e "\n[3] SUSFS PATCH CHECK:"
          echo "--------------------------------------------------"
          if [ -f "fs/susfs.c" ]; then echo "[+] fs/susfs.c is present."; else echo "[-] fs/susfs.c MISSING!"; fi
          REJECTS=$(find . -name "*.rej")
          if [ -z "$REJECTS" ]; then 
              echo "[+] 0 REJECTS. Patch applied cleanly."
          else 
              echo "[-] REJECTS FOUND! Patch failed."
              cat *.rej
          fi

          echo -e "\n[4] KSU CONSTANTS CHECK:"
          echo "--------------------------------------------------"
          # التأكد من تحويل الـ const إلى #define
          grep -R "#define KSU_" drivers/kernelsu/ 2>/dev/null | head -n 3 || echo "[-] KSU Constants patch might have failed."

          echo -e "\n============================================================"
          echo "ALL SYSTEMS INSPECTED."
          echo "============================================================"
