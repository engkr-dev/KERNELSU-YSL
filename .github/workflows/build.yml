name: Build ENGKR KSU-Next + SUSFS Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Fix Git Ownership & Install Basics
        run: |
          apt-get update
          apt-get install -y git wget
          git config --global --add safe.directory '*'

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment (Dependencies)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 sudo tar
          ln -s /usr/bin/python2 /usr/bin/python || true

      - name: Patch Build Script & GCC & SELinux
        run: |
          chmod +x kernel_build_fixed.sh
          # 1. إزالة واجهة menuconfig
          sed -i '/menuconfig/d' kernel_build_fixed.sh
          
          # 2. إجبار مترجم GCC 4.9 على العمل
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer.//g' include/linux/compiler-gcc.h
          
          # 3. التدخل الجراحي الأخير: تحويل أوامر SELinux المعقدة إلى أرقام صلبة للمترجم القديم
          sed -i 's/KSU_SEPOLICY_CMD_NORMAL_PERM/1/g' drivers/kernelsu/selinux/rules.c
          sed -i 's/KSU_SEPOLICY_CMD_XPERM/2/g' drivers/kernelsu/selinux/rules.c
          sed -i 's/KSU_SEPOLICY_CMD_TYPE_STATE/3/g' drivers/kernelsu/selinux/rules.c
          sed -i 's/KSU_SEPOLICY_CMD_TYPE_ATTR/5/g' drivers/kernelsu/selinux/rules.c
          sed -i 's/KSU_SEPOLICY_CMD_TYPE_TRANSITION/7/g' drivers/kernelsu/selinux/rules.c
          sed -i 's/KSU_SEPOLICY_CMD_TYPE_CHANGE/8/g' drivers/kernelsu/selinux/rules.c
          sed -i 's/KSU_SEPOLICY_CMD_TYPE/4/g' drivers/kernelsu/selinux/rules.c
          sed -i 's/KSU_SEPOLICY_CMD_ATTR/6/g' drivers/kernelsu/selinux/rules.c
          sed -i 's/KSU_SEPOLICY_CMD_GENFSCON/9/g' drivers/kernelsu/selinux/rules.c

      - name: Execute Kernel Build Script
        run: |
          chmod -R +x scripts/ || true
          chmod -R +x AnyKernel3/ || true
          ./kernel_build_fixed.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENGKR-YSL-KSU-SUSFS-Kernel
          path: ./*.zip
