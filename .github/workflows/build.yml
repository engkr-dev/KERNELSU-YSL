name: Build ENGKR KSU v3.1.0 + SUSFS (The Ultimate Builder V13)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Fix Git Ownership & Install Basics
        run: |
          apt-get update
          apt-get install -y git wget python3 unifdef
          git config --global --add safe.directory '*'

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 sudo tar
          ln -s /usr/bin/python2 /usr/bin/python || true

      - name: 1. Fetch Toolchains
        run: |
          echo "[*] Downloading GCC Toolchains..."
          mkdir -p toolchains/gcc64 toolchains/gcc32
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-11.0.0_r48.tar.gz -O gcc64.tar.gz
          tar -xf gcc64.tar.gz -C toolchains/gcc64
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-11.0.0_r48.tar.gz -O gcc32.tar.gz
          tar -xf gcc32.tar.gz -C toolchains/gcc32
          
          # إعداد المسارات المطلقة
          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> $GITHUB_PATH
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> $GITHUB_ENV

      - name: 2. VFS Surgeon & Injection
        run: |
          sed -i '/kernelsu/d' drivers/Makefile drivers/Kconfig fs/Makefile fs/Kconfig || true
          cat << 'EOF' > inject_vfs.py
          import os, re
          def inject_after_brace(file_path, func_pattern, hook_code):
              if not os.path.exists(file_path): return False
              with open(file_path, "r") as f: content = f.read()
              if "ksu_handle" in content: return True
              match = re.search(func_pattern + r'\s*\{', content)
              if match:
                  brace_end = match.end()
                  content = content[:brace_end] + "\n" + hook_code + content[brace_end:]
                  with open(file_path, "w") as f: f.write(content)
                  return True
              return False

          inject_after_brace("fs/open.c", r'long\s+do_sys_open\s*\([^)]*\)', "\n\textern bool ksu_vfs_open_hook; extern int ksu_handle_open(int *dfd, const char __user **filename_ptr, int *flags, umode_t *mode); if (unlikely(ksu_vfs_open_hook)) ksu_handle_open(&dfd, &filename, &flags, &mode);\n")
          inject_after_brace("fs/exec.c", r'static\s+int\s+do_execveat_common\s*\([^)]*\)', "\n\textern bool ksu_execveat_hook; extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *ptr, int *flags); if (unlikely(ksu_execveat_hook)) ksu_handle_execveat(&fd, &filename, &bprm, &flags);\n")
          EOF
          python3 inject_vfs.py
          
          git clone -b v3.1.0 https://github.com/tiann/KernelSU.git /tmp/ksu_official
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          patch -p1 < $(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.9.patch" | head -n 1) || true
          
          cp -r /tmp/ksu_official/kernel fs/kernelsu
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> fs/Makefile
          echo 'source "fs/kernelsu/Kconfig"' >> fs/Kconfig
          sed -i '1s/^/#include <linux\/susfs.h>\n/' fs/kernelsu/ksu.c
          echo -e "\nstatic int __init engkr_ksu_susfs_init(void) { #ifdef CONFIG_KSU_SUSFS\n\tsusfs_sus_path();\n#endif\n\treturn 0; }\nlate_initcall(engkr_ksu_susfs_init);" >> fs/kernelsu/ksu.c
          echo "ccflags-y += -DCONFIG_KSU_SUSFS -DKSU_VERSION=32302" >> fs/kernelsu/Kbuild

      - name: 3. Production Build
        run: |
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-ENGKR-KSU310-SUSFS"/g' arch/arm64/configs/ysl-perf_defconfig
          
          # البناء الصامت المباشر
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- ysl-perf_defconfig
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_SUSFS=y" >> .config
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- -j$(nproc)
          
          mkdir -p build && cp arch/arm64/boot/Image.gz-dtb build/

      - name: 4. Upload
        uses: actions/upload-artifact@v4
        with:
          name: ENGKR-YSL-KSU-FINAL-V13
          path: build/Image.gz-dtb
