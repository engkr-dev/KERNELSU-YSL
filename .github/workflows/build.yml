name: ENGKR Source Recon V16 (The Version Interrogator)

on:
  workflow_dispatch:

jobs:
  ksu-version-check:
    runs-on: ubuntu-latest

    steps:
      - name: The Version Interrogator (Replicating Masterpiece V2)
        run: |
          echo -e "\n============================================================"
          echo "🔍 INTERROGATING KERNELSU VERSION EXACTLY AS CLONED 🔍"
          echo "============================================================"

          echo "[*] Step 1: Executing the exact clone command from Masterpiece V2..."
          # نفس الأمر الذي كان موجوداً في السكربت السابق بالضبط
          git clone --depth=1 https://github.com/tiann/KernelSU.git /tmp/ksu_official

          echo -e "\n[*] Step 2: Extracting the EXACT Version from the downloaded source..."
          cd /tmp/ksu_official
          
          # جلب كل العلامات (Tags) لمعرفة الإصدار الرسمي المطابق للكود
          git fetch --tags --unshallow 2>/dev/null || git fetch --tags
          
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "UNKNOWN TAG")
          EXACT=$(git describe --tags --always 2>/dev/null)
          COMMIT=$(git log -1 --format="%h - %s")
          
          echo "------------------------------------------------------------"
          echo "🎯 EXACT RELEASE TAG (إصدار التطبيق المطلوب): $TAG"
          echo "🎯 FULL GIT DESCRIBE (الإصدار الدقيق للكود): $EXACT"
          echo "🎯 LATEST COMMIT (آخر تعديل تم سحبه): $COMMIT"
          echo "------------------------------------------------------------"

          echo -e "\n[*] Step 3: Checking the Kbuild Version Fallback Mechanism..."
          echo "(This explains why 'Unsupported' appeared when .git was not copied)"
          echo "------------------------------------------------------------"
          # فحص كيف يقرأ الكيرنل إصداره في غياب مجلد .git
          grep -n -E "KSU_GIT_VERSION|KSU_VERSION" kernel/Kbuild | head -n 15

          echo -e "\n============================================================"
          echo "SCAN COMPLETE."
          echo "============================================================"
