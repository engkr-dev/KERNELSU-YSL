name: Build ENGKR KSU v3.1.0 + SUSFS (The Silent Builder V10)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Fix Git Ownership & Install Basics
        run: |
          apt-get update
          apt-get install -y git wget python3 unifdef
          git config --global --add safe.directory '*'

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 sudo tar
          ln -s /usr/bin/python2 /usr/bin/python || true

      - name: 1. The Laser Purge
        run: |
          echo "[*] Cleaning kernel from old traces..."
          FILES=$(find fs/ include/ kernel/ block/ security/ -type f \( -name "*.c" -o -name "*.h" \) -print0 | xargs -0 grep -lE 'CONFIG_KSU_SUSFS|CONFIG_ZEROMOUNT' 2>/dev/null) || true
          for f in $FILES; do
              unifdef -UCONFIG_KSU_SUSFS -UCONFIG_KSU_SUSFS_SUS_PATH -UCONFIG_KSU_SUSFS_SUS_MOUNT -UCONFIG_KSU_SUSFS_OPEN_REDIRECT -UCONFIG_ZEROMOUNT -m "$f" || true
          done
          rm -fv fs/zeromount.c include/linux/zeromount.h
          sed -i '/zeromount\.o/d' fs/Makefile
          sed -i '/CONFIG_ZEROMOUNT/d' arch/arm64/configs/ysl-perf_defconfig || true
          sed -i '/kernelsu/d' drivers/Makefile drivers/Kconfig fs/Makefile fs/Kconfig || true

      - name: 2. Custom Kernel Naming
        run: |
          echo "[*] Injecting custom ENGKR kernel name..."
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-ENGKR-KSU310-SUSFS"/g' arch/arm64/configs/ysl-perf_defconfig

      - name: 3. The Python Sniper (VFS Hooking)
        run: |
          echo "[*] Injecting VFS Hooks locally..."
          cat << 'EOF' > inject_vfs.py
          import os, re
          def inject_after_brace(file_path, func_pattern, hook_code):
              if not os.path.exists(file_path): return False
              with open(file_path, "r") as f: content = f.read()
              if "ksu_handle" in content: return True
              if "#include <linux/types.h>" not in content: content = "#include <linux/types.h>\n" + content
              match = re.search(func_pattern + r'\s*\{', content)
              if match:
                  brace_end = match.end()
                  content = content[:brace_end] + "\n" + hook_code + content[brace_end:]
                  with open(file_path, "w") as f: f.write(content)
                  return True
              return False

          inject_after_brace("fs/open.c", r'long\s+do_sys_open\s*\([^)]*\)', "\n\textern bool ksu_vfs_open_hook __attribute__((weak));\n\textern int ksu_handle_open(int *dfd, const char __user **filename_ptr, int *flags, umode_t *mode) __attribute__((weak));\n\tif (unlikely(ksu_vfs_open_hook && ksu_handle_open)) {\n\t\tksu_handle_open(&dfd, &filename, &flags, &mode);\n\t}\n")
          inject_after_brace("fs/exec.c", r'static\s+int\s+do_execveat_common\s*\([^)]*\)', "\n\textern bool ksu_execveat_hook __attribute__((weak));\n\textern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *ptr, int *flags) __attribute__((weak));\n\tif (unlikely(ksu_execveat_hook && ksu_handle_execveat)) {\n\t\tksu_handle_execveat(&fd, &filename, &bprm, &flags);\n\t\tif (retval) goto out_free;\n\t}\n")
          EOF
          python3 inject_vfs.py
          
          git clone -b v3.1.0 https://github.com/tiann/KernelSU.git /tmp/ksu_official
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          patch -p1 < $(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.9.patch" | head -n 1) || true
          cp -r /tmp/ksu_official/kernel fs/kernelsu
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> fs/Makefile
          echo 'source "fs/kernelsu/Kconfig"' >> fs/Kconfig

      - name: 4. The Surgical SUSFS Injection
        run: |
          sed -i '1s/^/#include <linux\/susfs.h>\n/' fs/kernelsu/ksu.c
          echo -e "\nstatic int __init engkr_ksu_susfs_init(void) { #ifdef CONFIG_KSU_SUSFS\n\tsusfs_sus_path();\n#endif\n\treturn 0; }\nlate_initcall(engkr_ksu_susfs_init);" >> fs/kernelsu/ksu.c
          echo "ccflags-y += -DCONFIG_KSU_SUSFS -DKSU_VERSION=32302" >> fs/kernelsu/Kbuild

      - name: 5. Force Silent Build
        run: |
          # تنظيف أي استدعاء لـ menuconfig من السكربت الأصلي
          sed -i 's/make menuconfig/make olddefconfig/g' kernel_build_fixed.sh
          # التأكد من إعدادات الـ Config
          echo "CONFIG_KSU=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/ysl-perf_defconfig

      - name: 6. Execute Production Build
        run: |
          chmod -R +x scripts/ || true
          # تشغيل البناء الصامت
          ./kernel_build_fixed.sh || (echo "[-] Build Failed! Retrying with direct make..." && make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-android-)

      - name: 7. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENGKR-YSL-KSU-32302-SUSFS-SILENT
          path: |
            build/Image.gz-dtb
            *.zip
