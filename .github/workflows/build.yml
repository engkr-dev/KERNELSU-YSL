name: ENGKR Source Recon V14 (The Error Catcher)

on:
  workflow_dispatch:

jobs:
  kernel-recon:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Fix Git Ownership & Install Basics
        run: |
          apt-get update
          apt-get install -y git wget python3
          git config --global --add safe.directory '*'

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 sudo tar
          ln -s /usr/bin/python2 /usr/bin/python || true

      - name: Engine Swap (Official KSU Setup)
        run: |
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/tiann/KernelSU.git /tmp/ksu_official
          cp -r /tmp/ksu_official/kernel drivers/kernelsu

      - name: The Precision Purge & Fixes
        run: |
          chmod +x kernel_build_fixed.sh || true
          sed -i '/menuconfig/d' kernel_build_fixed.sh || true
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer.//g' include/linux/compiler-gcc.h || true
          
          # مسح KSU_SUSFS القديم لحماية النواة
          cat << 'EOF' > purge_script.py
          import os
          for d in ['fs', 'include', 'kernel', 'mm', 'block', 'security']:
              for root, dirs, files in os.walk(d):
                  for file in files:
                      if file.endswith(('.c', '.h')):
                          path = os.path.join(root, file)
                          try:
                              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                                  if 'CONFIG_KSU_SUSFS' not in f.read(): continue
                              with open(path, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
                              out_lines = []
                              skip = 0
                              for line in lines:
                                  clean = line.strip()
                                  if skip > 0:
                                      if clean.startswith('#endif'): skip -= 1
                                      elif clean.startswith('#if'): skip += 1
                                      continue
                                  if clean.startswith('#ifdef CONFIG_KSU_SUSFS') or clean.startswith('#if defined(CONFIG_KSU_SUSFS') or clean.startswith('#ifndef CONFIG_KSU_SUSFS'):
                                      skip = 1
                                      continue
                                  out_lines.append(line)
                              with open(path, 'w', encoding='utf-8') as f: f.writelines(out_lines)
                          except: pass
          EOF
          python3 purge_script.py

      - name: Integrate Official SUSFS 4.9
        run: |
          rm -fv fs/susfs.c include/linux/susfs.h
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu 2>/dev/null
          cp -v /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          patch -p1 < $(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.9.patch" | head -n 1) > /dev/null 2>&1 || true
          
          cd drivers/kernelsu
          patch -p1 < $(find /tmp/susfs4ksu/KernelSU_patches -name "*enable_susfs_for_ksu.patch" | head -n 1) > /dev/null 2>&1 || true
          cd ../..

      - name: Defconfig Activation
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/ysl-perf_defconfig

      - name: Targeted Build & Error Capture
        run: |
          echo -e "\n============================================================"
          echo "STARTING BUILD SIMULATION (SILENT MODE)"
          echo "============================================================"
          # تشغيل البناء وتوجيه كل المخرجات إلى ملف، وتجاهل فشل السكربت
          ./kernel_build_fixed.sh > build_full.log 2>&1 || true
          
          echo -e "\n============================================================"
          echo "💥 EXTRACTING THE REAL ERRORS 💥"
          echo "============================================================"
          # استخراج السطور التي تحتوي على error مع سطرين قبلها و 4 سطور بعدها
          grep -iE "^.*error:.*" -B 2 -A 4 build_full.log > real_errors.txt
          
          if [ -s real_errors.txt ]; then
              cat real_errors.txt
          else
              echo "[+] No obvious 'error:' tags found. The error might be a linker error (undefined reference)."
              echo "--- Tail of the build log ---"
              tail -n 50 build_full.log
          fi
