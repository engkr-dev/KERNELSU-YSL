name: Build ENGKR KSU-Next + SUSFS Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Fix Git Ownership & Install Basics
        run: |
          apt-get update
          apt-get install -y git wget python3
          git config --global --add safe.directory '*'

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment (Dependencies)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 sudo tar
          ln -s /usr/bin/python2 /usr/bin/python || true

      - name: The Ultimate Python Hack (Carpet Bombing KSU Constants)
        run: |
          chmod +x kernel_build_fixed.sh
          # 1. إزالة واجهة menuconfig
          sed -i '/menuconfig/d' kernel_build_fixed.sh
          
          # 2. تخطي حاجز الإصدار للمترجم
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer.//g' include/linux/compiler-gcc.h
          
          # 3. سكربت الثوابت الخاص بـ KSU
          cat << 'EOF' > patch_ksu.py
          import os, re
          pattern = r'(?:static\s+)?const\s+[a-zA-Z0-9_ ]+\s+(KSU_[A-Z0-9_]+)\s*=\s*([^;]+);'
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if not file.endswith(('.c', '.h')): continue
                  path = os.path.join(root, file)
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      new_content = re.sub(pattern, r'#define \1 \2', content)
                      if new_content != content:
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(new_content)
                          print(f"Patched KSU Constants in: {path}")
                  except Exception:
                      pass
          EOF
          python3 patch_ksu.py

      - name: The ENGKR Hardware Backdoor (WCNSS Direct Memory Override)
        run: |
          cat << 'EOF' > patch_mac_backdoor.py
          import os, re
          
          target = 'drivers/soc/qcom/wcnss/wcnss_wlan.c'
          if not os.path.exists(target):
              print(f"[-] FATAL ERROR: {target} not found!")
              exit(1)
              
          with open(target, 'r', encoding='utf-8') as f:
              content = f.read()
              
          backdoor_func = """
          // --- ENGKR DIRECT MEMORY BACKDOOR ---
          static ssize_t engkr_mac_store(struct device *dev, struct device_attribute *attr, const char *buf, size_t count) {
              unsigned int mac[6];
              if (!penv) return count;
              
              if (sscanf(buf, "%x:%x:%x:%x:%x:%x",
                  &mac[0], &mac[1], &mac[2], &mac[3], &mac[4], &mac[5]) == 6) {
                  
                  // مسح الماك الحقيقي وكتابة الماك المزيف مباشرة في قلب المودم!
                  penv->wlan_nv_mac_addr[0] = (char)mac[0];
                  penv->wlan_nv_mac_addr[1] = (char)mac[1];
                  penv->wlan_nv_mac_addr[2] = (char)mac[2];
                  penv->wlan_nv_mac_addr[3] = (char)mac[3];
                  penv->wlan_nv_mac_addr[4] = (char)mac[4];
                  penv->wlan_nv_mac_addr[5] = (char)mac[5];
                  
                  printk(KERN_INFO "ENGKR: Hardware MAC surgically altered in WCNSS baseband!\\n");
              }
              return count;
          }
          """
          
          # 1. استخراج اسم دالة العرض (show) الأصلية أياً كان اسمها
          attr_match = re.search(r'DEVICE_ATTR(?:_RO)?\s*\(\s*wcnss_mac_addr\s*,\s*[^,]+\s*,\s*([a-zA-Z0-9_]+)', content)
          if attr_match:
              show_func = attr_match.group(1)
              print(f"[+] Found original show function: {show_func}")
              
              # 2. زرع الدالة الخبيثة قبل دالة العرض مباشرة لتجنب خطأ (undeclared)
              func_match = re.search(rf'static\s+ssize_t\s+{show_func}', content)
              if func_match:
                  content = content[:func_match.start()] + backdoor_func + "\n" + content[func_match.start():]
              else:
                  # خطة بديلة للزرع
                  content = content.replace(attr_match.group(0), backdoor_func + "\n" + attr_match.group(0))
                  
              # 3. تحويل العقدة إلى وضع القراءة والكتابة (RW)
              content = re.sub(r'(static\s+)?DEVICE_ATTR(?:_RO)?\s*\(\s*wcnss_mac_addr[^;]+;', 
                               f'static DEVICE_ATTR(wcnss_mac_addr, 0664, {show_func}, engkr_mac_store);', content)
              print("[+] SysFS Node made WRITABLE and linked to backdoor!")
          else:
              print("[-] Could not find wcnss_mac_addr DEVICE_ATTR!")
              
          with open(target, 'w', encoding='utf-8') as f:
              f.write(content)
              
          print("[+] WCNSS Direct Memory Patch Applied Successfully.")
          EOF
          python3 patch_mac_backdoor.py

      - name: Execute Kernel Build Script
        run: |
          chmod -R +x scripts/ || true
          chmod -R +x AnyKernel3/ || true
          ./kernel_build_fixed.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENGKR-YSL-KSU-SUSFS-Kernel
          path: |
            build/Image.gz-dtb
            *.zip
