name: ENGKR Source Recon V6 (The Exact C Parser)

on:
  workflow_dispatch:

jobs:
  kernel-autopsy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: ENGKR Python Recon Script V6
        run: |
          cat << 'EOF' > engkr_recon_v6.py
          import os, re

          def print_header(title):
              print(f"\n{'='*60}\n{title}\n{'='*60}")

          def get_exact_func(filepath, func_name):
              if not os.path.exists(filepath):
                  return f"[-] File not found: {filepath}"
              with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              
              # نبحث عن تعريف الدالة الفعلي وليس التصريح (extern)
              # يجب أن تكون الدالة متبوعة بـ {
              pattern = r'(?:static\s+|void\s+|int\s+)[^\n;]*\b' + re.escape(func_name) + r'\b\s*\([^{;]*\{'
              match = re.search(pattern, content)
              if not match:
                  return f"[-] Function {func_name} not found or couldn't parse in {filepath}."
              
              start_idx = match.start()
              
              # حساب الأقواس لاستخراج الدالة بالكامل
              open_braces = 0
              idx = match.end() - 1 
              
              for i in range(idx, len(content)):
                  if content[i] == '{':
                      open_braces += 1
                  elif content[i] == '}':
                      open_braces -= 1
                      if open_braces == 0:
                          # استخراج أول 10 أسطر من الدالة فقط لمعرفة الهيكل
                          func_body = content[start_idx:i+1]
                          lines = func_body.split('\n')
                          return '\n'.join(lines[:12]) + '\n... [TRUNCATED]'
                          
              return "[-] Bracket parsing failed."

          print_header("ENGKR KERNEL SOURCE AUTOPSY REPORT - STAGE 6 (THE EXACT PARSER)")

          print("\n[1] EXACT show_map_vma() SIGNATURE (fs/proc/task_mmu.c)")
          print("-" * 50)
          print(get_exact_func('fs/proc/task_mmu.c', 'show_map_vma'))

          print("\n[2] EXACT show_mountinfo() SIGNATURE (fs/proc_namespace.c)")
          print("-" * 50)
          print(get_exact_func('fs/proc_namespace.c', 'show_mountinfo'))

          print("\n[3] EXACT filldir64() SIGNATURE (fs/readdir.c)")
          print("-" * 50)
          print(get_exact_func('fs/readdir.c', 'filldir64'))

          print_header("STAGE 6 COMPLETE")
          EOF
          python3 engkr_recon_v6.py
