name: Build ENGKR KSU-Next + SUSFS Kernel (FINAL V4)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Fix Git Ownership & Install Basics
        run: |
          apt-get update
          apt-get install -y git wget python3
          git config --global --add safe.directory '*'

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment (Dependencies)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 sudo tar
          ln -s /usr/bin/python2 /usr/bin/python || true

      - name: The Ultimate Python Hack (Carpet Bombing KSU Constants)
        run: |
          chmod +x kernel_build_fixed.sh || true
          sed -i '/menuconfig/d' kernel_build_fixed.sh || true
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer.//g' include/linux/compiler-gcc.h || true
          
          cat << 'EOF' > patch_ksu.py
          import os, re
          pattern = r'(?:static\s+)?const\s+[a-zA-Z0-9_ ]+\s+(KSU_[A-Z0-9_]+)\s*=\s*([^;]+);'
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if not file.endswith(('.c', '.h')): continue
                  path = os.path.join(root, file)
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      new_content = re.sub(pattern, r'#define \1 \2', content)
                      if new_content != content:
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(new_content)
                  except Exception:
                      pass
          EOF
          python3 patch_ksu.py

      - name: The ENGKR Precision Purge (Clearing Broken SUSFS Hooks)
        run: |
          cat << 'EOF' > purge_script.py
          import os
          target_dirs = ['fs', 'include', 'kernel', 'mm', 'block', 'security']
          infected_files = []
          for d in target_dirs:
              for root, dirs, files in os.walk(d):
                  for file in files:
                      if file.endswith(('.c', '.h')):
                          path = os.path.join(root, file)
                          try:
                              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                                  if 'CONFIG_KSU_SUSFS' in f.read():
                                      infected_files.append(path)
                          except: pass
          
          for path in infected_files:
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()
              out_lines = []
              skip_depth = 0
              for line in lines:
                  clean_line = line.strip()
                  if skip_depth > 0:
                      if clean_line.startswith('#endif'): skip_depth -= 1
                      elif clean_line.startswith('#if'): skip_depth += 1
                      continue
                  if clean_line.startswith('#ifdef CONFIG_KSU_SUSFS') or clean_line.startswith('#if defined(CONFIG_KSU_SUSFS') or clean_line.startswith('#ifndef CONFIG_KSU_SUSFS'):
                      skip_depth = 1
                      continue
                  out_lines.append(line)
              with open(path, 'w', encoding='utf-8') as f:
                  f.writelines(out_lines)
          EOF
          python3 purge_script.py

      - name: The ENGKR Surgical Fix (Restoring Collateral Damage)
        run: |
          cat << 'EOF' > fix_collateral.py
          import os
          try:
              with open('fs/namespace.c', 'r', encoding='utf-8') as f: lines = f.readlines()
              for i, line in enumerate(lines):
                  if 'static int mnt_alloc_group_id(' in line:
                      for j in range(i, min(i+5, len(lines))):
                          if '{' in lines[j] and 'int res' not in lines[j+1]:
                              lines.insert(j+1, '\tint res = 0;\n')
                              with open('fs/namespace.c', 'w', encoding='utf-8') as out: out.writelines(lines)
                              break
                      break
          except Exception as e: pass
          try:
              with open('kernel/kallsyms.c', 'r', encoding='utf-8') as f: lines = f.readlines()
              in_s_show = False
              for i, line in enumerate(lines):
                  if 'static int s_show(' in line: in_s_show = True
                  if in_s_show and line.startswith('}'):
                      lines.insert(i, '\treturn 0;\n')
                      with open('kernel/kallsyms.c', 'w', encoding='utf-8') as out: out.writelines(lines)
                      break
          except Exception as e: pass
          EOF
          python3 fix_collateral.py

      - name: Integrate Official SUSFS 4.9
        run: |
          rm -fv fs/susfs.c include/linux/susfs.h
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu 2>/dev/null
          cp -v /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          PATCH_FILE=$(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.9.patch" | head -n 1)
          patch -p1 < "$PATCH_FILE" > /tmp/patch_run.txt 2>&1 || true

      - name: The ENGKR Silencer Fix (KSU-Next Compatibility)
        run: |
          cat << 'EOF' > silence_ksu_errors.py
          import os
          dispatch_file = 'drivers/kernelsu/supercall/dispatch.c'
          if os.path.exists(dispatch_file):
              with open(dispatch_file, 'r', encoding='utf-8') as f: lines = f.readlines()
              for i, line in enumerate(lines):
                  if 'susfs_start_sdcard_monitor_fn();' in line: lines[i] = line.replace('susfs_start_sdcard_monitor_fn();', '// susfs_start_sdcard_monitor_fn();')
                  if 'susfs_is_current_proc_umounted()' in line: lines[i] = line.replace('susfs_is_current_proc_umounted()', '0 /* bypassed */')
              with open(dispatch_file, 'w', encoding='utf-8') as f: f.writelines(lines)
          EOF
          python3 silence_ksu_errors.py

      - name: The ENGKR Supercall Fix (Bridging SUSFS versions)
        run: |
          cat << 'EOF' > fix_supercall.py
          import os
          target = 'drivers/kernelsu/supercall/supercall.c'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8') as f:
                  lines = f.readlines()
              
              fallback_code = """
          // --- ENGKR SUPERCALL STUBS FOR 4.9 BACKPORT COMPATIBILITY ---
          #ifndef SUSFS_MAGIC
          #define SUSFS_MAGIC 0x53555314
          #endif
          #ifndef CMD_SUSFS_ADD_SUS_PATH_LOOP
          #define CMD_SUSFS_ADD_SUS_PATH_LOOP 0x1111
          static inline void susfs_add_sus_path_loop(void* arg) {}
          #endif
          #ifndef CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS
          #define CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS 0x2222
          static inline void susfs_set_hide_sus_mnts_for_non_su_procs(void* arg) {}
          #endif
          #ifndef CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG
          #define CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG 0x3333
          static inline void susfs_set_cmdline_or_bootconfig(void* arg) {}
          #endif
          #ifndef CMD_SUSFS_ADD_OPEN_REDIRECT
          #define CMD_SUSFS_ADD_OPEN_REDIRECT 0x4444
          static inline void susfs_add_open_redirect(void* arg) {}
          #endif
          #ifndef CMD_SUSFS_ADD_SUS_MAP
          #define CMD_SUSFS_ADD_SUS_MAP 0x5555
          static inline void susfs_add_sus_map(void* arg) {}
          #endif
          #ifndef CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING
          #define CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING 0x6666
          static inline void susfs_set_avc_log_spoofing(void* arg) {}
          #endif
          #ifndef CMD_SUSFS_SHOW_ENABLED_FEATURES
          #define CMD_SUSFS_SHOW_ENABLED_FEATURES 0x7777
          static inline void susfs_get_enabled_features(void* arg) {}
          #endif
          #ifndef CMD_SUSFS_SHOW_VARIANT
          #define CMD_SUSFS_SHOW_VARIANT 0x8888
          static inline void susfs_show_variant(void* arg) {}
          #endif
          #ifndef CMD_SUSFS_SHOW_VERSION
          #define CMD_SUSFS_SHOW_VERSION 0x9999
          static inline void susfs_show_version(void* arg) {}
          #endif
          #ifndef CMD_SUSFS_ENABLE_LOG
          #define CMD_SUSFS_ENABLE_LOG 0xAAAA
          static inline void susfs_enable_log(void* arg) {}
          #endif
          // -----------------------------------------------------------
          """
              last_inc = 0
              for i, line in enumerate(lines):
                  if line.startswith('#include'):
                      last_inc = i
              
              lines.insert(last_inc + 1, fallback_code + '\n')
              
              with open(target, 'w', encoding='utf-8') as f:
                  f.writelines(lines)
          EOF
          python3 fix_supercall.py

      - name: Activate KSU & SUSFS in Defconfig
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> arch/arm64/configs/ysl-perf_defconfig

      - name: The ENGKR Hardware Backdoor (WCNSS Direct Memory Override)
        run: |
          cat << 'EOF' > patch_mac_backdoor.py
          import os, re
          target = 'drivers/soc/qcom/wcnss/wcnss_wlan.c'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8') as f: content = f.read()
              backdoor_func = """
              static ssize_t engkr_mac_store(struct device *dev, struct device_attribute *attr, const char *buf, size_t count) {
                  unsigned int mac[6];
                  if (!penv) return count;
                  if (sscanf(buf, "%x:%x:%x:%x:%x:%x", &mac[0], &mac[1], &mac[2], &mac[3], &mac[4], &mac[5]) == 6) {
                      penv->wlan_nv_mac_addr[0] = (char)mac[0]; penv->wlan_nv_mac_addr[1] = (char)mac[1];
                      penv->wlan_nv_mac_addr[2] = (char)mac[2]; penv->wlan_nv_mac_addr[3] = (char)mac[3];
                      penv->wlan_nv_mac_addr[4] = (char)mac[4]; penv->wlan_nv_mac_addr[5] = (char)mac[5];
                  }
                  return count;
              }
              """
              attr_match = re.search(r'DEVICE_ATTR(?:_RO)?\s*\(\s*wcnss_mac_addr\s*,\s*[^,]+\s*,\s*([a-zA-Z0-9_]+)', content)
              if attr_match:
                  show_func = attr_match.group(1)
                  func_match = re.search(rf'static\s+ssize_t\s+{show_func}', content)
                  if func_match:
                      content = content[:func_match.start()] + backdoor_func + "\n" + content[func_match.start():]
                  else:
                      content = content.replace(attr_match.group(0), backdoor_func + "\n" + attr_match.group(0))
                  content = re.sub(r'(static\s+)?DEVICE_ATTR(?:_RO)?\s*\(\s*wcnss_mac_addr[^;]+;', f'static DEVICE_ATTR(wcnss_mac_addr, 0664, {show_func}, engkr_mac_store);', content)
                  with open(target, 'w', encoding='utf-8') as f: f.write(content)
          EOF
          python3 patch_mac_backdoor.py

      - name: Execute Kernel Build Script
        run: |
          chmod -R +x scripts/ || true
          chmod -R +x AnyKernel3/ || true
          ./kernel_build_fixed.sh

      - name: Upload Ultimate Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENGKR-YSL-SUSFS-Kernel
          path: |
            build/Image.gz-dtb
            *.zip
