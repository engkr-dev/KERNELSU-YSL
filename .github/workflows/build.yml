name: ENGKR Source Recon V9 (Final Integrity Audit)

on:
  workflow_dispatch:

jobs:
  kernel-autopsy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: ENGKR Comprehensive Audit Script
        run: |
          echo -e "\n============================================================"
          echo "ENGKR KERNEL SOURCE AUTOPSY REPORT - STAGE 9 (FINAL AUDIT)"
          echo "============================================================"

          echo -e "\n[1] PREPARING THE OFFICIAL SUSFS FILES"
          echo "--------------------------------------------------"
          rm -fv fs/susfs.c include/linux/susfs.h
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu 2>/dev/null
          PATCH_FILE=$(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.9.patch" | head -n 1)
          if [ -z "$PATCH_FILE" ]; then
              PATCH_FILE=$(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.14.patch" | head -n 1)
          fi
          echo "[+] Targeting patch: $(basename $PATCH_FILE)"

          echo -e "\n[2] FS/MAKEFILE INTEGRATION CHECK"
          echo "--------------------------------------------------"
          # هل الكيرنل جاهز لترجمة susfs.o؟
          grep -n -i "susfs" fs/Makefile || echo "[-] susfs.o is missing from fs/Makefile! We will need to inject it."

          echo -e "\n[3] DEFCONFIG INJECTION POINTS (ysl-perf_defconfig)"
          echo "--------------------------------------------------"
          # قراءة آخر 15 سطراً لمعرفة كيف نختم الملف بمفاتيح SUSFS
          echo "[*] Last 15 lines of ysl-perf_defconfig:"
          tail -n 15 arch/arm64/configs/ysl-perf_defconfig

          echo -e "\n[4] SURGICAL INJECTION TARGET 1: fs/readdir.c"
          echo "--------------------------------------------------"
          # فحص المنطقة التي سقط فيها الباتش بالسطر والرقم
          echo "[*] Context around <asm/uaccess.h>:"
          grep -n -C 5 "#include <asm/uaccess.h>" fs/readdir.c || echo "[-] uaccess.h not found!"

          echo -e "\n[5] SURGICAL INJECTION TARGET 2: fs/proc/task_mmu.c"
          echo "--------------------------------------------------"
          # فحص المنطقة الثانية التي سقط فيها الباتش
          echo "[*] Context around 'const char *name = NULL;':"
          grep -n -C 5 "const char \*name = NULL;" fs/proc/task_mmu.c || echo "[-] Target variable not found!"

          echo -e "\n[6] KSU CONFIGURATION CHECK"
          echo "--------------------------------------------------"
          # التأكد من أن KSU نفسه مفعل في الـ defconfig الأساسي
          grep -E "CONFIG_KSU" arch/arm64/configs/ysl-perf_defconfig || echo "[-] CONFIG_KSU is NOT set in defconfig! We must add it."

          echo -e "\n============================================================"
          echo "STAGE 9 COMPLETE - READY FOR FINAL BUILD SCRIPT"
          echo "============================================================"
