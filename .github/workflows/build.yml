name: Build ENGKR KSU-Next + SUSFS Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Fix Git Ownership & Install Basics
        run: |
          apt-get update
          apt-get install -y git wget python3
          git config --global --add safe.directory '*'

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment (Dependencies)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 sudo tar
          ln -s /usr/bin/python2 /usr/bin/python || true

      - name: The Ultimate Python Hack (Carpet Bombing KSU Constants)
        run: |
          chmod +x kernel_build_fixed.sh
          # 1. إزالة واجهة menuconfig لمنع توقف الخادم السحابي
          sed -i '/menuconfig/d' kernel_build_fixed.sh
          
          # 2. إجبار مترجم GCC 4.9 القديم على تخطي حاجز الإصدار
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer.//g' include/linux/compiler-gcc.h
          
          # 3. سكربت البايثون الشامل لتمشيط كامل النواة وتحويل الثوابت الحديثة إلى كلاسيكية
          cat << 'EOF' > patch_ksu.py
          import os, re
          # نمط البحث عن أي متغير يبدأ بـ KSU_ ومكتوب بصيغة static const
          pattern = r'(?:static\s+)?const\s+[a-zA-Z0-9_ ]+\s+(KSU_[A-Z0-9_]+)\s*=\s*([^;]+);'
          
          # البحث في كامل ملفات المشروع دون استثناء
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if not file.endswith(('.c', '.h')): continue
                  path = os.path.join(root, file)
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      
                      # عملية الاستبدال الجراحية
                      new_content = re.sub(pattern, r'#define \1 \2', content)
                      
                      if new_content != content:
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(new_content)
                          print(f"Patched KSU Constants in: {path}")
                  except Exception:
                      pass
          EOF
          python3 patch_ksu.py

      - name: The ENGKR Hardware Backdoor (Qualcomm WCNSS MAC Spoofer)
        run: |
          cat << 'EOF' > patch_mac_backdoor.py
          import os, re
          
          print("--- INITIATING WCNSS KERNEL BACKDOOR INJECTION ---")
          
          backdoor_code = """
          // --- ENGKR GOD-MODE MAC BACKDOOR ---
          u8 engkr_mac[6] = {0};
          int engkr_mac_set = 0;
          
          static ssize_t engkr_mac_store(struct device *dev, struct device_attribute *attr, const char *buf, size_t count) {
              if (sscanf(buf, "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                  &engkr_mac[0], &engkr_mac[1], &engkr_mac[2],
                  &engkr_mac[3], &engkr_mac[4], &engkr_mac[5]) == 6) {
                  engkr_mac_set = 1;
              }
              return count;
          }
          """
          
          for root, dirs, files in os.walk('drivers/'):
              for file in files:
                  if not file.endswith('.c'): continue
                  path = os.path.join(root, file)
          
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
          
                      modified = False
          
                      # 1. Patching Sysfs Node (wcnss_mac_addr_show)
                      if 'wcnss_mac_addr_show' in content:
                          if 'engkr_mac_store' not in content:
                              print(f"[*] Found SysFS Node in: {path}")
                              content = re.sub(r'(static\s+ssize_t\s+wcnss_mac_addr_show)', backdoor_code + r'\n\1', content, count=1)
                              content = re.sub(r'DEVICE_ATTR\(\s*wcnss_mac_addr\s*,\s*[^,]+\s*,\s*wcnss_mac_addr_show\s*,\s*NULL\s*\)', 
                                               r'DEVICE_ATTR(wcnss_mac_addr, 0664, wcnss_mac_addr_show, engkr_mac_store)', content)
                              
                              show_sig = re.search(r'static\s+ssize_t\s+wcnss_mac_addr_show\([^)]+\)\s*\{', content)
                              if show_sig:
                                  show_impl = show_sig.group(0) + """
              if (engkr_mac_set) {
                  return scnprintf(buf, PAGE_SIZE, "%02x:%02x:%02x:%02x:%02x:%02x\\n",
                      engkr_mac[0], engkr_mac[1], engkr_mac[2],
                      engkr_mac[3], engkr_mac[4], engkr_mac[5]);
              }"""
                                  content = content.replace(show_sig.group(0), show_impl)
                              modified = True
          
                      # 2. Patching the Core Hardware Fetcher (wcnss_get_wlan_mac_address)
                      if 'wcnss_get_wlan_mac_address' in content:
                          getter_match = re.search(r'int\s+wcnss_get_wlan_mac_address\s*\([^)]+?(?:\*|\s)([a-zA-Z0-9_]+)\s*\)\s*\{', content)
                          if getter_match:
                              mac_var_name = getter_match.group(1)
                              getter_impl = getter_match.group(0) + f"""
              extern u8 engkr_mac[6];
              extern int engkr_mac_set;
              if (engkr_mac_set) {{
                  memcpy({mac_var_name}, engkr_mac, 6);
                  return 0;
              }}"""
                              if 'engkr_mac_set' not in getter_match.group(0):
                                  print(f"[*] Found Hardware Fetcher in: {path}")
                                  content = content.replace(getter_match.group(0), getter_impl)
                                  modified = True
          
                      if modified:
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(content)
                          print(f"[+] Successfully Patched Kernel Backdoor in: {path}")
          
                  except Exception:
                      pass
          EOF
          python3 patch_mac_backdoor.py

      - name: Execute Kernel Build Script
        run: |
          chmod -R +x scripts/ || true
          chmod -R +x AnyKernel3/ || true
          ./kernel_build_fixed.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENGKR-YSL-KSU-SUSFS-Kernel
          path: |
            build/Image.gz-dtb
            *.zip
