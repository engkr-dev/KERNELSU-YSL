name: SUSFS 4.9 Backport (C Error Hunter)

on:
  workflow_dispatch:

jobs:
  kernel-c-debug:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Setup Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: UTC
        run: |
          ln -fs /usr/share/zoneinfo/UTC /etc/localtime
          apt-get update && apt-get install -y tzdata
          apt-get install -y git wget python3 bc bison build-essential ccache curl flex g++-multilib gcc-multilib lib32ncurses5-dev lib32readline-dev lib32z1-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2
          ln -s /usr/bin/python2 /usr/bin/python || true
          git config --global --add safe.directory '*'

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Fetch Toolchains (Smart Path)
        run: |
          mkdir -p toolchains/gcc64 toolchains/gcc32
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-11.0.0_r48.tar.gz -O gcc64.tar.gz
          tar -xf gcc64.tar.gz -C toolchains/gcc64
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-11.0.0_r48.tar.gz -O gcc32.tar.gz
          tar -xf gcc32.tar.gz -C toolchains/gcc32
          
          GCC64_BIN=$(find $PWD/toolchains/gcc64 -name "aarch64-linux-android-gcc" | xargs dirname)
          GCC32_BIN=$(find $PWD/toolchains/gcc32 -name "arm-linux-androideabi-gcc" | xargs dirname)
          
          echo "GCC64_PATH=$GCC64_BIN/aarch64-linux-android-" >> $GITHUB_ENV
          echo "GCC32_PATH=$GCC32_BIN/arm-linux-androideabi-" >> $GITHUB_ENV

      - name: Inject Pure SUSFS Engine
        run: |
          # مسح أي تجميعات قديمة
          make clean || true
          
          # جلب ملفات SUSFS الأساسية فقط
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          cp -v /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          
          # إجبار نظام البناء (Makefile) على تجميع susfs.o
          grep -q "susfs.o" fs/Makefile || echo "obj-y += susfs.o" >> fs/Makefile

      - name: Execute C Compilation (Hunting Mode)
        run: |
          echo "[*] Generating Defconfig..."
          make ARCH=arm64 CROSS_COMPILE=$GCC64_PATH CROSS_COMPILE_ARM32=$GCC32_PATH ysl-perf_defconfig
          
          # إجبار تفعيل خصائص SUSFS
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_SUSFS=y" >> .config
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> .config
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> .config
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> .config
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> .config
          
          echo "============================================================"
          echo " 🚦 INITIATING KERNEL 4.9 C COMPILATION (EXPECTING ERRORS) 🚦 "
          echo "============================================================"
          
          # نقوم بتشغيل البناء مع توجيه الأخطاء بوضوح
          make ARCH=arm64 CROSS_COMPILE=$GCC64_PATH CROSS_COMPILE_ARM32=$GCC32_PATH -j$(nproc) || true
          
          echo "============================================================"
          echo " 🔍 EXTRACTING SUSFS.C COMPILATION ERRORS 🔍 "
          echo "============================================================"
          make ARCH=arm64 CROSS_COMPILE=$GCC64_PATH CROSS_COMPILE_ARM32=$GCC32_PATH fs/susfs.o 2>&1 | grep -E "error:|warning:" || echo "No direct errors caught on fs/susfs.o. Check main log."
