name: Diagnostic Scan (Collect All Errors)

on:
  workflow_dispatch:

jobs:
  diagnostic-scan:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Fix Git Ownership & Install Basics
        run: |
          apt-get update
          apt-get install -y git wget python3 grep sed gawk findutils
          git config --global --add safe.directory '*'

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python2 sudo tar
          ln -sf /usr/bin/python2 /usr/bin/python || true

      - name: Prepare Diagnostic Mode
        run: |
          chmod +x kernel_build_fixed.sh || true
          sed -i '/menuconfig/d' kernel_build_fixed.sh || true
          sed -i 's/set -e/set +e/g' kernel_build_fixed.sh || true
          sed -i 's/make -j/make -k -j/g' kernel_build_fixed.sh || true

      - name: Strip Unsupported Warning Flags
        run: |
          cat << 'EOF' > sanitize_flags.py
          import os, re

          bad_patterns = [
              r'-Wno-error=int-conversion',
              r'-Werror=int-conversion',
              r'-Wno-int-conversion',
              r'-Wno-error=incompatible-pointer-types',
              r'-Werror=incompatible-pointer-types',
              r'-Wno-incompatible-pointer-types',
              r'-Wno-gcc-compat',
          ]

          file_names = {'Makefile', 'Kbuild'}
          exts = ('.mk', '.sh', '.py')

          def clean_text(text):
              original = text
              for p in bad_patterns:
                  text = re.sub(r'(^|\\s)'+p+r'(?=\\s|$)', ' ', text)
              text = re.sub(r'[ \\t]+', ' ', text)
              text = re.sub(r' *\n', '\n', text)
              return text, text != original

          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f in file_names or f.endswith(exts):
                      path = os.path.join(root, f)
                      try:
                          with open(path, 'r', encoding='utf-8', errors='ignore') as fh:
                              data = fh.read()
                          new_data, changed = clean_text(data)
                          if changed:
                              with open(path, 'w', encoding='utf-8') as fh:
                                  fh.write(new_data)
                      except Exception:
                          pass
          EOF
          python3 sanitize_flags.py

      - name: Run Diagnostic Build
        env:
          MAKEFLAGS: "-k"
          KCFLAGS: "-fmax-errors=500"
        run: |
          echo "[*] Running diagnostic build..."
          ./kernel_build_fixed.sh 2>&1 | tee build_full.log || true

      - name: Extract Final Error Report
        run: |
          {
            echo "======================================================="
            echo "FINAL DIAGNOSTIC REPORT"
            echo "======================================================="
            echo
            echo "[1] Fatal compiler / linker / make errors"
            echo "-------------------------------------------------------"
            grep -nEi \
              "fatal error:|error:|undefined reference|multiple definition|No such file|ld: error:|collect2: error:|make(\[[0-9]+\])?: \*\*\*" \
              build_full.log || true
            echo
            echo "[2] KernelSU / SUSFS related lines"
            echo "-------------------------------------------------------"
            grep -nEi \
              "kernelsu|susfs|supercall|dispatch\.c|supercall\.c|implicit declaration|undeclared|incompatible pointer" \
              build_full.log || true
            echo
            echo "[3] Warning flags unsupported by compiler"
            echo "-------------------------------------------------------"
            grep -nEi \
              "no option -W|unrecognized command line option" \
              build_full.log || true
            echo
            echo "[4] Last 200 lines for context"
            echo "-------------------------------------------------------"
            tail -n 200 build_full.log || true
          } > extracted_errors_final.txt

          echo "======================================================="
          echo "DIAGNOSTIC SUMMARY"
          echo "======================================================="
          sed -n '1,220p' extracted_errors_final.txt || true

      - name: Upload Diagnostic Logs
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostic-Logs-Full
          path: |
            build_full.log
            extracted_errors_final.txt
