name: ENGKR Source Recon V3 (Build Matrix & Kconfig)

on:
  workflow_dispatch:

jobs:
  kernel-autopsy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: ENGKR Python Recon Script V3
        run: |
          cat << 'EOF' > engkr_recon_v3.py
          import os, glob

          def print_header(title):
              print(f"\n{'='*60}\n{title}\n{'='*60}")

          def search_in_file(filepath, keywords):
              if not os.path.exists(filepath):
                  return f"[-] Not found: {filepath}"
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      lines = f.readlines()
                  
                  results = []
                  for i, line in enumerate(lines):
                      if any(k in line for k in keywords):
                          results.append(f"Line {i+1}: {line.strip()}")
                  
                  if results:
                      return f"[+] {filepath}:\n    " + "\n    ".join(results)
                  else:
                      return f"[-] No matches in {filepath}"
              except Exception as e:
                  return f"[-] Error: {e}"

          print_header("ENGKR KERNEL SOURCE AUTOPSY REPORT - STAGE 3")

          # 1. IDENTIFY THE BUILD SCRIPT TARGET
          print("\n[1] BUILD SCRIPT ANALYSIS (Looking for defconfig target)")
          print("-" * 50)
          build_scripts = glob.glob('*.sh')
          for script in build_scripts:
              print(f"--- Scanning {script} ---")
              print(search_in_file(script, ['make', 'defconfig', 'YSL', 'ysl', 'BUILD']))

          # 2. FIND ALL YSL DEFCONFIGS
          print("\n[2] DEVICE DEFCONFIG FILES (The Power Switches)")
          print("-" * 50)
          defconfigs = glob.glob('arch/arm64/configs/*ysl*') + glob.glob('arch/arm64/configs/*8953*')
          if not defconfigs:
              print("[-] No specific ysl or msm8953 defconfigs found in arch/arm64/configs/")
          else:
              for dconf in set(defconfigs):
                  print(f"\n--- Checking {dconf} ---")
                  print(search_in_file(dconf, ['KSU', 'SUSFS', 'OVERLAY_FS', 'PROFILING']))

          # 3. KCONFIG & MAKEFILE INTEGRATION (Does the build system know about SUSFS?)
          print("\n[3] KBUILD & KCONFIG INTEGRATION (fs/ level)")
          print("-" * 50)
          print(search_in_file('fs/Makefile', ['ksu', 'susfs']))
          print(search_in_file('fs/Kconfig', ['KSU', 'SUSFS']))

          # 4. KSU DRIVER MAKEFILE (Is KSU pulling SUSFS?)
          print("\n[4] KERNELSU DRIVER INTEGRATION")
          print("-" * 50)
          print(search_in_file('drivers/kernelsu/Makefile', ['susfs', 'SUSFS']))
          print(search_in_file('drivers/kernelsu/Kconfig', ['SUSFS']))

          print_header("STAGE 3 COMPLETE")
          EOF
          python3 engkr_recon_v3.py
