name: ENGKR Source Recon V5 (The Sniper Scope)

on:
  workflow_dispatch:

jobs:
  kernel-autopsy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: ENGKR Python Recon Script V5
        run: |
          cat << 'EOF' > engkr_recon_v5.py
          import os

          def print_header(title):
              print(f"\n{'='*60}\n{title}\n{'='*60}")

          def extract_func_body(filepath, signature, lines_count=40):
              if not os.path.exists(filepath):
                  return f"[-] File not found: {filepath}"
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      lines = f.readlines()
                  
                  for i, line in enumerate(lines):
                      if signature in line and not line.strip().startswith(('//', '/*')):
                          body = "".join(lines[i:min(i + lines_count, len(lines))])
                          return f"[+] Extracted from {filepath}:\n{'-'*50}\n{body}{'-'*50}"
                  return f"[-] Signature '{signature}' not found in {filepath}."
              except Exception as e:
                  return f"[-] Error: {e}"

          print_header("ENGKR KERNEL SOURCE AUTOPSY REPORT - STAGE 5 (FINAL)")

          # 1. DIRECTORY READING (Target: filldir64)
          print("\n[1] DIRECTORY READING BODY (fs/readdir.c)")
          print(extract_func_body('fs/readdir.c', 'static int filldir64(', 30))

          # 2. MEMORY MAPS EXPOSURE (Target: show_map_vma)
          print("\n[2] MEMORY MAPS BODY (fs/proc/task_mmu.c)")
          print(extract_func_body('fs/proc/task_mmu.c', 'show_map_vma(struct', 40))

          # 3. MOUNTS EXPOSURE (Target: show_mountinfo)
          print("\n[3] MOUNTS BODY (fs/proc_namespace.c)")
          print(extract_func_body('fs/proc_namespace.c', 'static int show_mountinfo(', 40))

          # 4. TRACING TASK NAME EXTRACTION
          print("\n[4] TASK COMM (How to get process name securely)")
          print(extract_func_body('include/linux/sched.h', 'static inline void get_task_comm(', 15))

          print_header("STAGE 5 COMPLETE - READY FOR INJECTION")
          EOF
          python3 engkr_recon_v5.py
