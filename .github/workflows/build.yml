name: ENGKR Source Recon V8.1 (Reject Analyzer Fix)

on:
  workflow_dispatch:

jobs:
  kernel-autopsy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: ENGKR SUSFS Reject Analyzer
        run: |
          echo -e "\n============================================================"
          echo "ENGKR KERNEL SOURCE AUTOPSY REPORT - STAGE 8.1"
          echo "============================================================"

          echo -e "\n[1] PREPARING ENVIRONMENT"
          echo "--------------------------------------------------"
          rm -fv fs/susfs.c include/linux/susfs.h
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu 2>/dev/null
          cp -v /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          
          PATCH_FILE=$(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.9.patch" | head -n 1)
          if [ -z "$PATCH_FILE" ]; then
              PATCH_FILE=$(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.14.patch" | head -n 1)
          fi

          echo -e "\n[2] APPLYING PATCH (IGNORING GITHUB ERRORS)"
          echo "--------------------------------------------------"
          # إضافة || true لمنع الجيت هب من قتل السكربت عند فشل الباتش
          patch -p1 < "$PATCH_FILE" > /tmp/patch_run.txt 2>&1 || true
          
          echo -e "\n[3] ANALYZING REJECT FILES (.rej)"
          echo "--------------------------------------------------"
          REJECT_FILES=$(find . -name "*.rej")
          
          if [ -z "$REJECT_FILES" ]; then
              echo "[+] UNEXPECTED: No reject files found. Did it actually succeed?"
              cat /tmp/patch_run.txt
          else
              for rej_file in $REJECT_FILES; do
                  ORIG_FILE="${rej_file%.rej}"
                  echo -e "\n========================================"
                  echo "💥 REJECT FOUND IN: $ORIG_FILE"
                  echo "========================================"
                  
                  echo "--- The Code that FAILED to apply (.rej content) ---"
                  cat "$rej_file"
                  
                  echo -e "\n--- The Surrounding Target Code in your Kernel ($ORIG_FILE) ---"
                  SEARCH_STRING=$(grep -v "^+" "$rej_file" | grep -v "^-" | grep -v "^@" | head -n 2 | tail -n 1 | sed 's/^[ \t]*//')
                  
                  if [ -n "$SEARCH_STRING" ]; then
                      grep -C 5 -F "$SEARCH_STRING" "$ORIG_FILE" || head -n 50 "$ORIG_FILE"
                  else
                      head -n 50 "$ORIG_FILE"
                  fi
              done
          fi

          echo -e "\n============================================================"
          echo "STAGE 8.1 COMPLETE"
          echo "============================================================"
