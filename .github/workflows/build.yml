name: Build ENGKR KSU v3.1.0 + SUSFS (The VFS Master Key)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Fix Git Ownership & Install Basics
        run: |
          apt-get update
          apt-get install -y git wget python3 unifdef
          git config --global --add safe.directory '*'

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 sudo tar
          ln -s /usr/bin/python2 /usr/bin/python || true

      - name: 1. The Laser Purge
        run: |
          echo "[*] Cleaning kernel from old traces..."
          FILES=$(find fs/ include/ kernel/ block/ security/ -type f \( -name "*.c" -o -name "*.h" \) -print0 | xargs -0 grep -lE 'CONFIG_KSU_SUSFS|CONFIG_ZEROMOUNT' 2>/dev/null) || true
          for f in $FILES; do
              unifdef -UCONFIG_KSU_SUSFS -UCONFIG_KSU_SUSFS_SUS_PATH -UCONFIG_KSU_SUSFS_SUS_MOUNT -UCONFIG_KSU_SUSFS_OPEN_REDIRECT -UCONFIG_ZEROMOUNT -m "$f" || true
          done
          rm -fv fs/zeromount.c include/linux/zeromount.h
          sed -i '/zeromount\.o/d' fs/Makefile
          sed -i '/CONFIG_ZEROMOUNT/d' arch/arm64/configs/ysl-perf_defconfig || true

      - name: 2. Custom Kernel Naming
        run: |
          echo "[*] Injecting custom ENGKR kernel name..."
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-ENGKR-KSU310-SUSFS"/g' arch/arm64/configs/ysl-perf_defconfig

      - name: 3. The VFS Bridge & Engine Swap (The Master Key)
        run: |
          echo "[*] 1. Fetching Perfect VFS Hooks from KSU-Next..."
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next.git /tmp/ksu_next
          
          echo "[*] 2. Injecting Hooks into Kernel Core (fs/exec.c, fs/open.c)..."
          PATCH_DIR=$(find /tmp/ksu_next -type d -name "4.9" | grep "patches" | head -n 1)
          if [ -n "$PATCH_DIR" ]; then
              for p in $PATCH_DIR/*.patch; do
                  patch -p1 < "$p" || true
              done
              echo "[+] VFS Hooks surgically applied!"
          else
              echo "[-] FATAL: Could not find 4.9 patches!"
              exit 1
          fi
          
          echo "[*] 3. Fetching Official KernelSU v3.1.0 Engine..."
          rm -rf drivers/kernelsu
          git clone -b v3.1.0 https://github.com/tiann/KernelSU.git drivers/kernelsu
          
          echo "[*] 4. Wiring KernelSU into Makefile..."
          grep -q "kernelsu" drivers/Makefile || echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          
          echo "[*] 5. Forcing Version Hardcode to 32302..."
          sed -i 's/ccflags-y += -DKSU_VERSION.*//g' drivers/kernelsu/Kbuild
          sed -i 's/-DKSU_VERSION=[^ ]*//g' drivers/kernelsu/Kbuild
          echo "ccflags-y += -DKSU_VERSION=32302" >> drivers/kernelsu/Kbuild

      - name: 4. SUSFS Core Integration
        run: |
          echo "[*] Downloading SUSFS..."
          rm -fv fs/susfs.c include/linux/susfs.h
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          
          echo "[*] Applying Kernel 4.9 Patch..."
          cp -v /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          patch -p1 < $(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.9.patch" | head -n 1) || true

      - name: 5. The Surgical SUSFS Injection
        run: |
          echo "[*] Wiring SUSFS surgically into KSU v3.1.0..."
          
          sed -i '1s/^/#include <linux\/susfs.h>\n/' drivers/kernelsu/ksu.c
          
          cat << 'EOF' >> drivers/kernelsu/ksu.c
          
          /* ENGKR SUSFS MANUAL INITIALIZATION HOOK */
          static int __init engkr_ksu_susfs_init(void) {
          #ifdef CONFIG_KSU_SUSFS
              susfs_sus_path();
              pr_info("ENGKR: SUSFS successfully injected and initialized.\n");
          #endif
              return 0;
          }
          late_initcall(engkr_ksu_susfs_init);
          EOF
          
          echo "ccflags-y += -DCONFIG_KSU_SUSFS" >> drivers/kernelsu/Kbuild

      - name: 6. KSU Constants Polyfill
        run: |
          chmod +x kernel_build_fixed.sh || true
          sed -i '/menuconfig/d' kernel_build_fixed.sh || true
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer.//g' include/linux/compiler-gcc.h || true
          
          cat << 'EOF' > patch_ksu.py
          import os, re
          pattern = r'(?:static\s+)?const\s+[a-zA-Z0-9_ ]+\s+(KSU_[A-Z0-9_]+)\s*=\s*([^;]+);'
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if not file.endswith(('.c', '.h')): continue
                  path = os.path.join(root, file)
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f: content = f.read()
                      new_content = re.sub(pattern, r'#define \1 \2', content)
                      if new_content != content:
                          with open(path, 'w', encoding='utf-8') as f: f.write(new_content)
                  except: pass
          EOF
          python3 patch_ksu.py

      - name: 7. Hardware Backdoor Injection
        run: |
          cat << 'EOF' > patch_mac_backdoor.py
          import os, re
          target = 'drivers/soc/qcom/wcnss/wcnss_wlan.c'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8') as f: content = f.read()
              backdoor_func = """
              static ssize_t engkr_mac_store(struct device *dev, struct device_attribute *attr, const char *buf, size_t count) {
                  unsigned int mac[6];
                  if (!penv) return count;
                  if (sscanf(buf, "%x:%x:%x:%x:%x:%x", &mac[0], &mac[1], &mac[2], &mac[3], &mac[4], &mac[5]) == 6) {
                      penv->wlan_nv_mac_addr[0] = (char)mac[0]; penv->wlan_nv_mac_addr[1] = (char)mac[1];
                      penv->wlan_nv_mac_addr[2] = (char)mac[2]; penv->wlan_nv_mac_addr[3] = (char)mac[3];
                      penv->wlan_nv_mac_addr[4] = (char)mac[4]; penv->wlan_nv_mac_addr[5] = (char)mac[5];
                  }
                  return count;
              }
              """
              attr_match = re.search(r'DEVICE_ATTR(?:_RO)?\s*\(\s*wcnss_mac_addr\s*,\s*[^,]+\s*,\s*([a-zA-Z0-9_]+)', content)
              if attr_match:
                  show_func = attr_match.group(1)
                  func_match = re.search(rf'static\s+ssize_t\s+{show_func}', content)
                  if func_match: content = content[:func_match.start()] + backdoor_func + "\n" + content[func_match.start():]
                  else: content = content.replace(attr_match.group(0), backdoor_func + "\n" + attr_match.group(0))
                  content = re.sub(r'(static\s+)?DEVICE_ATTR(?:_RO)?\s*\(\s*wcnss_mac_addr[^;]+;', f'static DEVICE_ATTR(wcnss_mac_addr, 0664, {show_func}, engkr_mac_store);', content)
                  with open(target, 'w', encoding='utf-8') as f: f.write(content)
          EOF
          python3 patch_mac_backdoor.py

      - name: 8. 🚦 THE PRE-FLIGHT CHECK GATE 🚦
        run: |
          echo -e "\n============================================================"
          echo "🚦 INITIATING STRICT PRE-FLIGHT VALIDATION 🚦"
          echo "============================================================"
          if [ ! -d "drivers/kernelsu" ]; then echo "[-] FATAL: drivers/kernelsu directory missing!"; exit 1; fi
          
          # الدليل القاطع على نجاح زرع الخطافات في قلب النظام
          if ! grep -q "ksu_handle_execve" fs/exec.c; then echo "[-] FATAL: VFS Hook missing in fs/exec.c!"; exit 1; fi
          echo "[+] System Hooks Verified in fs/exec.c!"
          
          if ! grep -q "32302" drivers/kernelsu/Kbuild; then echo "[-] FATAL: Version 32302 not hardcoded in Kbuild!"; exit 1; fi
          if ! grep -q "engkr_ksu_susfs_init" drivers/kernelsu/ksu.c; then echo "[-] FATAL: Surgical SUSFS hook failed!"; exit 1; fi
          
          echo "CONFIG_KSU=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/ysl-perf_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> arch/arm64/configs/ysl-perf_defconfig
          
          echo -e "============================================================"
          echo "🟢 ALL SYSTEMS GO! PROCEEDING TO COMPILATION 🟢"
          echo "============================================================"

      - name: 9. Execute Production Build
        run: |
          chmod -R +x scripts/ || true
          chmod -R +x AnyKernel3/ || true
          ./kernel_build_fixed.sh

      - name: 10. Upload Ultimate Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENGKR-YSL-KSU-32302-SUSFS
          path: |
            build/Image.gz-dtb
            *.zip
