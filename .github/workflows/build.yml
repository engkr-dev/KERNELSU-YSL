name: ENGKR Omniscient MAC Recon

on:
  workflow_dispatch:

jobs:
  kernel-recon:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Fix Git Ownership & Install Python
        run: |
          apt-get update
          apt-get install -y git python3
          git config --global --add safe.directory '*'

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: The Omniscient MAC Radar (Full Picture Recon)
        run: |
          cat << 'EOF' > omni_recon.py
          import os
          import re

          print("\n" + "="*70)
          print(" 🌐 ENGKR OMNISCIENT MAC RADAR: FULL KERNEL SCAN ")
          print("="*70)

          # توسيع دائرة البحث لتشمل درايفر الواي فاي ونظام تواصل كوالكوم الأساسي
          target_dirs = [
              'drivers/staging/qcacld-2.0',
              'drivers/staging/prima',
              'drivers/net/wireless',
              'drivers/soc/qcom/wcnss' # مسار غاية في الأهمية للتواصل مع المودم
          ]

          # تصنيف الكلمات المفتاحية للحصول على الصورة الكاملة
          categories = {
              "[1] HARDWARE FETCH (SMEM/NV/QMI)": [
                  r'wcnss_get_wlan_mac', r'smem_alloc.*mac', r'nv_mac', r'qmi.*wlan.*mac', r'wcnss_get_mac_addr'
              ],
              "[2] DRIVER INTERNAL STATE (PRIMA/QCACLD)": [
                  r'wlan_hdd_update_mac', r'hdd_update_mac_config', r'vos_mac_addr', r'sme_update_mac', r'macAddressCurrent'
              ],
              "[3] LINUX NETDEV ASSIGNMENT (IOCTL/IFCONFIG)": [
                  r'dev->dev_addr\s*=', r'\.ndo_set_mac_address', r'wlan_hdd_set_mac_address', r'SIOCSIFHWADDR'
              ]
          }

          found_dirs = [d for d in target_dirs if os.path.exists(d)]
          if not found_dirs:
              print("[-] Warning: Primary target dirs not found. Scanning 'drivers/' entirely...")
              found_dirs = ['drivers/']
          else:
              print(f"[+] Radar locked on targets: {found_dirs}")

          print("\n[*] Commencing Deep Sector Scan...\n")

          report = {k: [] for k in categories.keys()}
          
          for d in found_dirs:
              for root, dirs, files in os.walk(d):
                  for file in files:
                      if file.endswith(('.c', '.h')):
                          file_path = os.path.join(root, file)
                          try:
                              with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                                  lines = f.readlines()
                                  
                              for i, line in enumerate(lines):
                                  for cat_name, patterns in categories.items():
                                      for pat in patterns:
                                          if re.search(pat, line, re.IGNORECASE):
                                              # استخراج السياق
                                              context = []
                                              start = max(0, i - 2)
                                              end = min(len(lines), i + 3)
                                              for j in range(start, end):
                                                  prefix = ">> " if j == i else "   "
                                                  context.append(f"{prefix}L{j+1}: {lines[j].rstrip()}")
                                              
                                              report[cat_name].append({
                                                  'file': file_path,
                                                  'line': i + 1,
                                                  'pattern': pat,
                                                  'context': "\n".join(context)
                                              })
                          except Exception:
                              pass

          # طباعة التقرير النهائي المنظم
          for cat_name, findings in report.items():
              print("\n" + "*"*70)
              print(f" {cat_name} - Found: {len(findings)}")
              print("*"*70)
              
              # منع إغراق السجلات إذا كانت النتائج كثيرة جداً، نعرض أهمها
              for idx, finding in enumerate(findings[:15]): 
                  print(f"\n[!] Match #{idx+1} in {finding['file']}")
                  print(f"--- Code Context ---")
                  print(finding['context'])
                  print("-" * 30)
              if len(findings) > 15:
                  print(f"\n... and {len(findings) - 15} more matches in this category.")

          print("\n" + "="*70)
          print(" 🏁 RADAR SCAN COMPLETE. ")
          print("="*70)
          EOF
          
          python3 omni_recon.py
