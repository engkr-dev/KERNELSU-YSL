name: Build ENGKR KSU v3.1.0 + SUSFS (The Path-Finder V15)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Setup Environment
        run: |
          apt-get update
          apt-get install -y git wget python3 unifdef bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 sudo tar
          git config --global --add safe.directory '*'

      - name: 1. Fetch Toolchains (Smart Path Detection)
        run: |
          mkdir -p toolchains/gcc64 toolchains/gcc32
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-11.0.0_r48.tar.gz -O gcc64.tar.gz
          tar -xf gcc64.tar.gz -C toolchains/gcc64
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-11.0.0_r48.tar.gz -O gcc32.tar.gz
          tar -xf gcc32.tar.gz -C toolchains/gcc32
          
          # اكتشاف المسار الحقيقي للـ bin
          GCC64_BIN=$(find $PWD/toolchains/gcc64 -name "aarch64-linux-android-gcc" | xargs dirname)
          GCC32_BIN=$(find $PWD/toolchains/gcc32 -name "arm-linux-androideabi-gcc" | xargs dirname)
          
          echo "GCC64_PATH=$GCC64_BIN/aarch64-linux-android-" >> $GITHUB_ENV
          echo "GCC32_PATH=$GCC32_BIN/arm-linux-androideabi-" >> $GITHUB_ENV
          
          echo "[*] GCC64 Path: $GCC64_BIN"
          echo "[*] GCC32 Path: $GCC32_BIN"
          [ -f "$GCC64_BIN/aarch64-linux-android-gcc" ] || { echo "[-] GCC64 not found!"; exit 1; }

      - name: 2. Patching and Injection
        run: |
          sed -i '/kernelsu/d' drivers/Makefile drivers/Kconfig fs/Makefile fs/Kconfig || true
          
          git clone -b v3.1.0 https://github.com/tiann/KernelSU.git /tmp/ksu_official
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          
          # استخدام --force لتجاوز فشل الـ hunks
          patch -p1 --force < $(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.9.patch" | head -n 1) || true
          
          cp -r /tmp/ksu_official/kernel fs/kernelsu
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> fs/Makefile
          echo 'source "fs/kernelsu/Kconfig"' >> fs/Kconfig
          sed -i '1s/^/#include <linux\/susfs.h>\n/' fs/kernelsu/ksu.c
          echo -e "\nstatic int __init engkr_ksu_susfs_init(void) { #ifdef CONFIG_KSU_SUSFS\n\tsusfs_sus_path();\n#endif\n\treturn 0; }\nlate_initcall(engkr_ksu_susfs_init);" >> fs/kernelsu/ksu.c
          echo "ccflags-y += -DCONFIG_KSU_SUSFS -DKSU_VERSION=32302" >> fs/kernelsu/Kbuild

      - name: 3. Production Build
        run: |
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-ENGKR-KSU310-SUSFS"/g' arch/arm64/configs/ysl-perf_defconfig
          
          make ARCH=arm64 CROSS_COMPILE=$GCC64_PATH CROSS_COMPILE_ARM32=$GCC32_PATH ysl-perf_defconfig
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_SUSFS=y" >> .config
          
          make ARCH=arm64 CROSS_COMPILE=$GCC64_PATH CROSS_COMPILE_ARM32=$GCC32_PATH -j$(nproc)
          
          mkdir -p build && cp arch/arm64/boot/Image.gz-dtb build/

      - name: 4. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENGKR-YSL-KSU-FINAL-V15
          path: build/Image.gz-dtb
