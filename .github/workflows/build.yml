name: ENGKR Source Recon V10 (Deep Ecosystem Radar)

on:
  workflow_dispatch:

jobs:
  kernel-autopsy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: ENGKR Deep Radar Script
        run: |
          echo -e "\n============================================================"
          echo "ENGKR KERNEL SOURCE AUTOPSY REPORT - STAGE 10 (DEEP RADAR)"
          echo "============================================================"

          echo -e "\n[1] SUSFS & KSU HOOKS COUNT ACROSS VFS LAYER (The Infection Scan)"
          echo "--------------------------------------------------"
          # قائمة بكل الملفات التي يتلاعب بها KSU و SUSFS عادة
          TARGETS=(
              "fs/open.c"
              "fs/stat.c"
              "fs/dcache.c"
              "fs/readdir.c"
              "fs/exec.c"
              "fs/read_write.c"
              "fs/proc/fd.c"
              "fs/proc/task_mmu.c"
              "fs/notify/inotify/inotify_user.c"
              "include/linux/sched.h"
          )
          
          for file in "${TARGETS[@]}"; do
              if [ -f "$file" ]; then
                  # إحصاء عدد المرات التي ظهرت فيها الكلمات
                  sus_count=$(grep -c -i "susfs" "$file" 2>/dev/null || echo "0")
                  ksu_count=$(grep -c -i "ksu" "$file" 2>/dev/null || echo "0")
                  
                  echo "-> $file:"
                  echo "   SUSFS hooks found: $sus_count"
                  echo "   KSU hooks found  : $ksu_count"
                  
                  # إذا وجدنا أكواد، نطبع أول سطرين لنعرف هل هي رسمية أم معطوبة
                  if [ "$sus_count" -gt 0 ]; then
                      echo "   [Preview of SUSFS in this file]:"
                      grep -n -i "susfs" "$file" | head -n 2 | sed 's/^/      /'
                  fi
                  if [ "$ksu_count" -gt 0 ] && [ "$sus_count" -eq 0 ]; then
                      echo "   [Preview of KSU in this file]:"
                      grep -n -i "ksu" "$file" | head -n 2 | sed 's/^/      /'
                  fi
              else
                  echo "-> $file: [!] FILE NOT FOUND!"
              fi
          done

          echo -e "\n[2] KERNELSU DRIVER LINKAGE CHECK"
          echo "--------------------------------------------------"
          # هل KSU مربوط في الميك فايل الخاص بالتعريفات؟
          if [ -d "drivers/kernelsu" ]; then
              grep -n "kernelsu" drivers/Makefile || echo "[-] KSU is NOT linked in drivers/Makefile! It's a ghost folder."
          else
              echo "[-] drivers/kernelsu directory MISSING!"
          fi

          echo -e "\n[3] SEARCHING FOR HIDDEN DEFCONFIGS (The KSU Mystery)"
          echo "--------------------------------------------------"
          # البحث في كل ملفات الإعدادات عن CONFIG_KSU=y
          grep -rn "CONFIG_KSU=y" arch/arm64/configs/ 2>/dev/null || echo "[-] CONFIG_KSU=y is genuinely missing from ALL defconfigs!"

          echo -e "\n============================================================"
          echo "STAGE 10 COMPLETE"
          echo "============================================================"
