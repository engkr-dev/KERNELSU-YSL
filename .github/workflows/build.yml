name: ENGKR Source Recon V11.1 (Precision Purge)

on:
  workflow_dispatch:

jobs:
  kernel-autopsy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: ENGKR Precision Purge & Patch Simulator
        run: |
          cat << 'EOF' > simulate_build_v2.py
          import os

          print("\n============================================================")
          print("ENGKR KERNEL SOURCE AUTOPSY REPORT - STAGE 11.1 (PRECISION)")
          print("============================================================")
          
          target_dirs = ['fs', 'include', 'kernel', 'mm', 'block', 'security']
          infected_files = []

          for d in target_dirs:
              for root, dirs, files in os.walk(d):
                  for file in files:
                      if file.endswith(('.c', '.h')):
                          path = os.path.join(root, file)
                          try:
                              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                                  if 'CONFIG_KSU_SUSFS' in f.read():
                                      infected_files.append(path)
                          except:
                              pass
          
          print(f"[+] Found {len(infected_files)} files infected with broken SUSFS.")
          print("[*] Initiating The Precision Purge (Leaving base KSU intact)...")

          for path in infected_files:
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()
              
              out_lines = []
              skip_depth = 0
              purged_blocks = 0
              
              for line in lines:
                  clean_line = line.strip()
                  
                  if skip_depth > 0:
                      if clean_line.startswith('#endif'):
                          skip_depth -= 1
                      elif clean_line.startswith('#if'):
                          skip_depth += 1
                      continue
                  
                  # البتر يستهدف SUSFS فقط، ويترك KSU الأصلي ليعمل كمرساة للباتش
                  if clean_line.startswith('#ifdef CONFIG_KSU_SUSFS') or clean_line.startswith('#if defined(CONFIG_KSU_SUSFS') or clean_line.startswith('#ifndef CONFIG_KSU_SUSFS'):
                      skip_depth = 1
                      purged_blocks += 1
                      continue
                      
                  out_lines.append(line)
              
              with open(path, 'w', encoding='utf-8') as f:
                  f.writelines(out_lines)
              print(f"    -> Purged {purged_blocks} broken SUSFS hooks from {path}")

          EOF
          python3 simulate_build_v2.py

          echo -e "\n[2] FETCHING OFFICIAL SUSFS"
          echo "--------------------------------------------------"
          rm -fv fs/susfs.c include/linux/susfs.h
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu 2>/dev/null
          cp -v /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/

          PATCH_FILE=$(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.9.patch" | head -n 1)

          echo -e "\n[3] APPLYING OFFICIAL PATCH POST-PURGE"
          echo "--------------------------------------------------"
          patch -p1 < "$PATCH_FILE" > /tmp/patch_run.txt 2>&1 || true
          
          REJECTS=$(find . -name "*.rej")
          if [ -z "$REJECTS" ]; then
              echo -e "\n[+] 🟢 INCREDIBLE SUCCESS! 0 REJECTS."
              echo "[+] Precision Purge works perfectly. KSU Anchors found!"
          else
              echo -e "\n[-] 🔴 WARNING: SOME REJECTS STILL EXIST!"
              for rej in $REJECTS; do
                  echo "--- $rej ---"
                  cat "$rej"
              done
          fi
          
          echo -e "\n============================================================"
          echo "STAGE 11.1 COMPLETE"
          echo "============================================================"
