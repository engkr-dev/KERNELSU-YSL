name: ENGKR Source Recon V2 (ProcFS & Memory Maps)

on:
  workflow_dispatch:

jobs:
  kernel-autopsy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: ENGKR Python Recon Script V2
        run: |
          cat << 'EOF' > engkr_recon_v2.py
          import os

          def print_header(title):
              print(f"\n{'='*60}\n{title}\n{'='*60}")

          def search_context(filepath, keyword, lines_before=2, lines_after=12):
              if not os.path.exists(filepath):
                  return f"[-] File not found: {filepath}"
              with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()
              
              for i, line in enumerate(lines):
                  if keyword in line and not line.strip().startswith(('//', '/*')):
                      start = max(0, i - lines_before)
                      end = min(len(lines), i + lines_after)
                      result = f"[+] Found '{keyword}' in {filepath}:\n"
                      result += "-" * 50 + "\n"
                      result += "".join(lines[start:end])
                      result += "-" * 50
                      return result
              return f"[-] Keyword '{keyword}' not found in {filepath}."

          print_header("ENGKR KERNEL SOURCE AUTOPSY REPORT - STAGE 2")

          # 1. MEMORY MAPS ARCHITECTURE (Where Zygisk leaks)
          # نبحث عن دالة طباعة الذاكرة لنعترضها ونخفي libvndksupport
          print("\n[1] MEMORY MAPS EXPOSURE (fs/proc/task_mmu.c)")
          print(search_context('fs/proc/task_mmu.c', 'show_map_vma('))

          # 2. MOUNTS ARCHITECTURE (Where OverlayFS leaks)
          # نبحث عن دالة طباعة الـ Mounts لنخفي loop27 و meta-overlayfs
          print("\n[2] MOUNTS EXPOSURE (fs/proc_namespace.c)")
          print(search_context('fs/proc_namespace.c', 'show_mountinfo('))
          print(search_context('fs/proc_namespace.c', 'show_vfsmnt('))

          # 3. DIRECTORY LISTING (Where Magisk paths leak)
          # دوال عرض محتويات المجلدات لنخفي مجلد TWRP و Magisk
          print("\n[3] DIRECTORY LISTING ACTORS (fs/readdir.c)")
          print(search_context('fs/readdir.c', 'static int filldir64('))
          print(search_context('fs/readdir.c', 'static int filldir('))

          # 4. PATH RESOLUTION (The String Generator)
          print("\n[4] STRING GENERATOR (fs/seq_file.c)")
          print(search_context('fs/seq_file.c', 'int seq_path('))

          print_header("STAGE 2 COMPLETE")
          EOF
          python3 engkr_recon_v2.pyname: ENGKR Source Recon V2 (ProcFS & Memory Maps)

