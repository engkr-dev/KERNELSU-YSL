name: KERNEL RECONNAISSANCE PROBE (The X-Ray)

on:
  workflow_dispatch:

jobs:
  recon-mission:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: The Python X-Ray Scanner
        run: |
          cat << 'EOF' > kernel_xray.py
          import os
          import glob

          print("\n" + "="*60)
          print(" 🕵️‍♂️ KERNEL RECONNAISSANCE REPORT STARTED 🕵️‍♂️ ")
          print("="*60 + "\n")

          # 1. تحديد مكان KernelSU-Next بالضبط
          ksu_dirs = glob.glob("**/kernelsu", recursive=True) + glob.glob("**/KernelSU-Next", recursive=True)
          print(f"[*] 1. KernelSU Directories Found: {ksu_dirs}")

          # 2. فحص ملف ksu.c للعثور على دالة الإقلاع (Init)
          for kdir in ksu_dirs:
              ksu_c = os.path.join(kdir, "ksu.c")
              if os.path.exists(ksu_c):
                  print(f"\n[*] 2. Analyzing {ksu_c} for initialization routines:")
                  with open(ksu_c, "r", encoding="utf-8", errors="ignore") as f:
                      lines = f.readlines()
                      for i, line in enumerate(lines):
                          # نبحث عن الدوال التي تبدأ بـ init أو late_initcall
                          if "initcall" in line or "__init" in line or "susfs" in line.lower():
                              print(f"    Line {i+1}: {line.strip()}")

          # 3. فحص خطافات VFS الأساسية لمعرفة كيف تم حقنها مسبقاً
          vfs_files = ["fs/open.c", "fs/exec.c", "fs/read_write.c", "fs/stat.c"]
          print("\n[*] 3. Scanning VFS Core Files for existing KSU hooks:")
          for vfs in vfs_files:
              if os.path.exists(vfs):
                  hook_found = False
                  with open(vfs, "r", encoding="utf-8", errors="ignore") as f:
                      lines = f.readlines()
                      for i, line in enumerate(lines):
                          if "ksu" in line.lower():
                              if not hook_found:
                                  print(f"\n  --> Hooks found in {vfs}:")
                                  hook_found = True
                              print(f"      Line {i+1}: {line.strip()}")
                  if not hook_found:
                      print(f"  [-] No KSU hooks found in {vfs}")
              else:
                  print(f"  [!] File {vfs} does not exist!")

          # 4. فحص ملفات Kbuild و Makefile لمعرفة طريقة الربط
          print("\n[*] 4. Checking Build Configs (Kbuild/Makefile) for KSU parameters:")
          for kdir in ksu_dirs:
              kbuild = os.path.join(kdir, "Kbuild")
              if os.path.exists(kbuild):
                  with open(kbuild, "r", encoding="utf-8", errors="ignore") as f:
                      print(f"  --> Content of {kbuild}:")
                      for line in f.readlines():
                          if "ccflags" in line or "VERSION" in line:
                              print(f"      {line.strip()}")

          # 5. التحقق من وجود SUSFS القديم
          print("\n[*] 5. Checking for legacy SUSFS files:")
          print(f"  --> fs/susfs.c exists: {os.path.exists('fs/susfs.c')}")
          print(f"  --> include/linux/susfs.h exists: {os.path.exists('include/linux/susfs.h')}")

          print("\n" + "="*60)
          print(" 🏁 RECONNAISSANCE COMPLETE 🏁 ")
          print("="*60 + "\n")
          EOF
          
          python3 kernel_xray.py
