name: SUSFS 4.9 Backport (The Final Integration)

on:
  workflow_dispatch:

jobs:
  kernel-build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Setup Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: UTC
        run: |
          ln -fs /usr/share/zoneinfo/UTC /etc/localtime
          apt-get update && apt-get install -y tzdata
          apt-get install -y git wget python3 bc bison build-essential ccache curl flex g++-multilib gcc-multilib lib32ncurses5-dev lib32readline-dev lib32z1-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2
          ln -s /usr/bin/python2 /usr/bin/python || true
          git config --global --add safe.directory '*'

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Fetch Toolchains (LineageOS)
        run: |
          echo "[*] Cloning official LineageOS GCC 4.9 Toolchains..."
          git clone --depth=1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32
          
          echo "GCC64_PATH=$PWD/gcc64/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "GCC32_PATH=$PWD/gcc32/bin/arm-linux-androideabi-" >> $GITHUB_ENV

      - name: Inject Pure SUSFS Engine & Polyfills
        run: |
          make clean || true
          
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          cp -v /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          
          grep -q "susfs.o" fs/Makefile || echo "obj-y += susfs.o" >> fs/Makefile
          
          echo "[*] Bypassing GCC Version Check..."
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer.//g' include/linux/compiler-gcc.h || true
          
          echo "[*] Polyfilling zeromount.c to bypass missing SUSFS function..."
          # هذا التعديل يستبدل الدالة الناقصة بقيمة `false` منطقية لكي يكمل البناء دون تعطيل الوظيفة الأساسية
          sed -i 's/if (susfs_is_current_proc_umounted())/if (0 \/* polyfill: susfs_is_current_proc_umounted() *\/)/g' fs/zeromount.c || true

      - name: Execute Full Kernel Compilation
        run: |
          echo "[*] Generating Defconfig..."
          make ARCH=arm64 CROSS_COMPILE=$GCC64_PATH CROSS_COMPILE_ARM32=$GCC32_PATH ysl-perf_defconfig
          
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_SUSFS=y" >> .config
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> .config
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> .config
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> .config
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> .config
          
          echo "============================================================"
          echo " 🚦 INITIATING KERNEL 4.9 FINAL COMPILATION 🚦 "
          echo "============================================================"
          
          # أزلنا الـ `|| true` لأننا نريد الآن بناءً حقيقياً كاملاً وليس صيداً للأخطاء
          make ARCH=arm64 CROSS_COMPILE=$GCC64_PATH CROSS_COMPILE_ARM32=$GCC32_PATH -j$(nproc)
          
          mkdir -p build && cp arch/arm64/boot/Image.gz-dtb build/ || echo "[-] Boot image not found!"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENGKR-YSL-KSU-NEXT-SUSFS-BACKPORTED
          path: build/Image.gz-dtb
