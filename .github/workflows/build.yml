name: ENGKR Source Recon V8 (Reject Analyzer)

on:
  workflow_dispatch:

jobs:
  kernel-autopsy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: ENGKR SUSFS Reject Analyzer
        run: |
          cat << 'EOF' > engkr_recon_v8.sh
          #!/bin/bash
          
          echo -e "\n============================================================"
          echo "ENGKR KERNEL SOURCE AUTOPSY REPORT - STAGE 8"
          echo "============================================================"

          echo -e "\n[1] PREPARING ENVIRONMENT"
          echo "--------------------------------------------------"
          rm -fv fs/susfs.c include/linux/susfs.h
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu 2>/dev/null
          cp -v /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          
          PATCH_FILE=$(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.9.patch" | head -n 1)
          if [ -z "$PATCH_FILE" ]; then
              PATCH_FILE=$(find /tmp/susfs4ksu/kernel_patches -name "*kernel-4.14.patch" | head -n 1)
          fi

          echo -e "\n[2] APPLYING PATCH (EXPECTING FAILURES)"
          echo "--------------------------------------------------"
          # تطبيق الباتش فعلياً للسماح له بتوليد ملفات .rej
          patch -p1 < "$PATCH_FILE" > /tmp/patch_run.txt 2>&1
          
          echo -e "\n[3] ANALYZING REJECT FILES (.rej)"
          echo "--------------------------------------------------"
          # البحث عن ملفات الرفض التي نتجت عن الفشل
          REJECT_FILES=$(find . -
