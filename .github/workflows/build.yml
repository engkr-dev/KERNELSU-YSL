- name: Execute C Compilation (Hunting Mode)
        run: |
          echo "[*] Generating Defconfig..."
          make ARCH=arm64 CROSS_COMPILE=$GCC64_PATH CROSS_COMPILE_ARM32=$GCC32_PATH ysl-perf_defconfig
          
          # إجبار تفعيل خصائص SUSFS
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_SUSFS=y" >> .config
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> .config
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> .config
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> .config
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> .config
          
          echo "[*] Bypassing GCC Version Check..."
          # هذا هو السطر السحري الذي سيسكت المترجم ويجعله يتجاوز عقبة الإصدار 4.9
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer.//g' include/linux/compiler-gcc.h || true
          
          echo "============================================================"
          echo " 🚦 INITIATING KERNEL 4.9 C COMPILATION (EXPECTING ERRORS) 🚦 "
          echo "============================================================"
          
          make ARCH=arm64 CROSS_COMPILE=$GCC64_PATH CROSS_COMPILE_ARM32=$GCC32_PATH -j$(nproc) || true
          
          echo "============================================================"
          echo " 🔍 EXTRACTING SUSFS.C COMPILATION ERRORS 🔍 "
          echo "============================================================"
          make ARCH=arm64 CROSS_COMPILE=$GCC64_PATH CROSS_COMPILE_ARM32=$GCC32_PATH fs/susfs.o 2>&1 | grep -E "error:|warning:" || echo "No direct errors caught on fs/susfs.o. Check main log."
